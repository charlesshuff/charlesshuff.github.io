@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "17b-Sequence-Modeling" as E1   {
package "PayloadDefinitions" as E2   {
def "Subscribe" as E3  <<(T,blue) item  def>> 
def "Publish" as E4  <<(T,blue) item  def>> 
def "Deliver" as E5  <<(T,blue) item  def>> 
}
def "PubSubSequence" as E6  <<(T,blue) occurrence  def>> 
}
E1 ..> E2 : <<import>>*
@enduml

