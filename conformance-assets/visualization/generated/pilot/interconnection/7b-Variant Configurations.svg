"#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="932" x="5" y="593.1423">comp usage "normalPerformanceRequirement  ::&gt; RequirementsModel::normalPerformanceRequirement" as E51 &lt;&lt;variant&gt;&gt;\n &lt;&lt;(T ...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="612.2102">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="523" x="5" y="631.2781">rec usage "&lt;&amp;bar-trig&gt; &lt;i&gt;engineChoice&lt;/i&gt; &lt;s&gt;vehicle::engine&lt;/s&gt;" as E52 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="421" x="5" y="650.346">comp usage "4cylEngine: 4CylEngine  " as E53 &lt;&lt;variant&gt;&gt;\n{</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93" x="9" y="669.414">Syntax Error?</text><!--MD5=[d186ae9edd5c40114811c1e9388683f0]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "7b-Variant Configurations" as E1   {
package "RequirementsModel" as E2   {
comp def "EnginePerformanceRequirement" as E3  <<(T,blue) requirement  def>> {
}
comp usage "highPerformanceRequirement: EnginePerformanceRequirement  " as E4  <<(T,blue) requirement>> {
}
comp usage "normalPerformanceRequirement: EnginePerformanceRequirement  " as E5  <<(T,blue) requirement>> {
}
}
package "DesignModel" as E6   {
rec def "Vehicle" as E7  <<(T,blue) part  def>> {
}
rec def "Engine" as E8  <<(T,blue) part  def>> {
}
rec def "Transmission" as E9  <<(T,blue) part  def>> {
}
rec def "Clutch" as E10  <<(T,blue) part  def>> {
}
rec def "Driveshaft" as E11  <<(T,blue) part  def>> {
}
rec def "RearAxleAssembly" as E12  <<(T,blue) part  def>> {
}
rec def "Wheel" as E13  <<(T,blue) part  def>> {
}
def "FuelCmdPort" as E14  <<(T,blue) port  def>> 
def "ClutchPort" as E15  <<(T,blue) port  def>> 
def "ShaftPort_b" as E16  <<(T,blue) port  def>> 
def "ShaftPort_c" as E17  <<(T,blue) port  def>> 
def "ShaftPort_d" as E18  <<(T,blue) port  def>> 
def "VehicleToRoadPort" as E19  <<(T,blue) port  def>> 
def "WheelToRoadPort" as E20  <<(T,blue) port  def>> 
rec usage "vehicle: Vehicle" as E21 {
portout "fuelCmdPort  " as E22  <<(T,blue) port>> 
rec usage "engine: Engine" as E23 {
portin "fuelCmdPort: FuelCmdPort  " as E24  <<(T,blue) port>> 
}
rec usage "transmission: Transmission" as E25 {
rec usage "clutch: Clutch" as E26 {
portin "clutchPort: ClutchPort  " as E27  <<(T,blue) port>> 
}
}
rec usage "driveshaft: Driveshaft" as E28 {
portin "shaftPort_b: ShaftPort_b  " as E29  <<(T,blue) port>> 
portin "shaftPort_c: ShaftPort_c  " as E30  <<(T,blue) port>> 
}
rec usage "rearAxleAssembly: RearAxleAssembly" as E31 {
rec usage "rearWheels: Wheel" as E32 {
portin "wheelToRoadPort: WheelToRoadPort  " as E33  <<(T,blue) port>> 
}
}
rec usage "vehicleToRoadPort: VehicleToRoadPort  " as E35  <<(T,blue) port>> {
portin "wheelToRoadPort: WheelToRoadPort  " as E34  <<(T,blue) port>> 
}
}
}
package "VariantDefinitions" as E36   {
rec def "4CylEngine" as E37  <<(T,blue) part  def>> {
}
rec def "6CylEngine" as E38  <<(T,blue) part  def>> {
}
rec def "ManualTransmission" as E39  <<(T,blue) part  def>> {
}
rec def "AutomaticTransmission" as E40  <<(T,blue) part  def>> {
}
rec def "ManualClutch" as E41  <<(T,blue) part  def>> {
}
rec def "AutomaticClutch" as E42  <<(T,blue) part  def>> {
}
def "ManualClutchPort" as E43  <<(T,blue) port  def>> 
def "AutomaticClutchPort" as E44  <<(T,blue) port  def>> 
rec def "NarrowRimWheel" as E45  <<(T,blue) part  def>> {
}
rec def "WideRimWheel" as E46  <<(T,blue) part  def>> {
}
}
package "VariabilityModel" as E47   {
rec usage "anyVehicleConfig:>DesignModel::vehicle" as E48 {
comp usage "<i>engineRqtChoice</i>: EnginePerformanceRequirement  " as E49  <<variation>>\n <<(T,blue) requirement>> {
}
comp usage "highPerformanceRequirement  ::> RequirementsModel::highPerformanceRequirement" as E50 <<variant>>\n <<(T,blue) reference>> {
}
comp usage "normalPerformanceRequirement  ::> RequirementsModel::normalPerformanceRequirement" as E51 <<variant>>\n <<(T,blue) reference>> {
}
rec usage "<&bar-trig> <i>engineChoice</i> <s>vehicle::engine</s>" as E52 {
comp usage "4cylEngine: 4CylEngine  " as E53 <<variant>>\n{
}
comp usage "6cylEngine: 6CylEngine  " as E54 <<variant>>\n{
}
}
comp usage "engine choice constraint  " as E55  << assert constraint>> {
##//operator expressions//##
 { if engineRqtChoice <U+003D><U+003D> engineRqtChoice::highPerformanceRequirement? 					engineChoice <U+003D><U+003D> engineChoice::<U+0027>6cylEngine<U+0027> 				else					engineChoice <U+003D><U+003D> engineChoice::<U+0027>4cylEngine<U+0027> }
}
rec usage "<&bar-trig> <i>transmissionChoice</i> <s>vehicle::transmission</s>" as E56 {
comp usage "manualTransmission: ManualTransmission  " as E57 <<variant>>\n{
}
comp usage "clutch: ManualClutch  " as E58 {
}
comp usage "clutchPort: ManualClutchPort  " as E59  <<(T,blue) port>> {
}
comp usage "automaticTransmission: AutomaticTransmission  " as E60 <<variant>>\n{
}
comp usage "clutch: AutomaticClutch  " as E61 {
}
comp usage "clutchPort: AutomaticClutchPort  " as E62  <<(T,blue) port>> {
}
}
comp usage "engine-transmission selection constraint  " as E63  << assert constraint>> {
##//operator expressions//##
 { (engineChoice <U+003D><U+003D> engineChoice::<U+0027>4cylEngine<U+0027> and transmissionChoice <U+003D><U+003D> transmissionChoice::manualTransmission) xor				(engineChoice <U+003D><U+003D> engineChoice::<U+0027>6cylEngine<U+0027> and transmissionChoice <U+003D><U+003D> transmissionChoice::automaticTransmission) }
}
rec usage "<&bar-trig> rearAxleAssembly <s>vehicle::rearAxleAssembly</s>" as E64 {
rec usage "<&bar-trig> <i>rearWheelChoice</i> <s>rearAxleAssembly::rearWheels</s>" as E65 {
comp usage "narrowRimWheel: NarrowRimWheel  " as E66 <<variant>>\n{
}
comp usage "wideRimWheel: WideRimWheel  " as E67 <<variant>>\n{
}
}
comp usage "engine-wheel selection constraint  " as E68  << assert constraint>> {
##//operator expressions//##
 { (engineChoice <U+003D><U+003D> engineChoice::<U+0027>4cylEngine<U+0027> and     					rearWheelChoice<U+002D>>forAll {in ref w; w <U+003D><U+003D> rearWheelChoice::narrowRimWheel}) xor    				(engineChoice <U+003D><U+003D> engineChoice::<U+0027>6cylEngine<U+0027> and     					rearWheelChoice<U+002D>>forAll {in ref w; w <U+003D><U+003D> rearWheelChoice::wideRimWheel}) }
}
}
}
rec usage "<i>vehicleChoice</i>:>anyVehicleConfig" as E69 {
comp usage "vehicle_c1  " as E70 <<variant>>\n{
}
comp usage "vehicle_c2  " as E71 <<variant>>\n{
}
}
}
}
E1 ..> E2 : <<import>>*
E4 - -:|> E3 
E5 - -:|> E3 
E1 ..> E6 : <<import>>*
