E49 +- - - E50 
E49 +- - - E51 
E52 - -||> E23 
E52 - -> E49 : <<satisfy>>
E57 *- - E58 
E58 - -||> E26 
E58 - -:|> E41 
E58 o- - E59 
E59 - -||> E27 
E59 - -:|> E43 
E60 *- - E61 
E61 - -||> E26 
E61 - -:|> E42 
E61 o- - E62 
E62 - -||> E27 
E62 - -:|> E44 
