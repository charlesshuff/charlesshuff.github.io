@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_02-Basic Value Properties" as E1   {
def "LengthValue" as E2  <<(T,blue) attribute  def>> 
rec def "Tire" as E3  <<(T,blue) part  def>> {
comp usage "manufacturer: String  " as E4  <<(T,blue) attribute>> {
}
comp usage "hubDiameter: LengthValue  " as E5  <<(T,blue) attribute>> {
}
comp usage "width: Integer  " as E6  <<(T,blue) attribute>> {
}
}
rec usage "frenchTire: Tire" as E7 {
comp usage "manufacturer  " as E8  <<(T,blue) attribute>> {
##//values//##
 <U+003D> "Michelin"
}
comp usage "hubDiameter  " as E9  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 18.0
}
comp usage "width  " as E10  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 245
}
}
}
E5 - -:|> E2 
E8 - -||> E4 
E9 - -||> E5 
E10 - -||> E6 
E7 - -:|> E3 
@enduml

