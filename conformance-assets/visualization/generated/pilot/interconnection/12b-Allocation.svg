@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "12b-Allocation" as E1   {
package "LogicalModel" as E2   {
rec usage "providePower" as E3  <<(T,blue) action>> {
rec usage "generateTorque" as E4  <<(T,blue) action>> {
}

}

rec usage "torqueGenerator" as E5 {
}
}
package "PhysicalModel" as E7   {
rec usage "powerTrain" as E8 {
rec usage "engine" as E9 {
}
}
}
}
E1 ..> E2 : <<import>>*
E5 - -> E4 : <<perform>>
E1 ..> E7 : <<import>>*
E9 - -> E4 : <<perform>>
E5 -[thickness=5,dotted]-> E8 
@enduml

