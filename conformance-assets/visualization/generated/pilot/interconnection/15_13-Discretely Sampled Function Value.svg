@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_13-Discretely Sampled Function Value" as E1   {
def "MissionElapsedTimeScale" as E2  <<(T,blue) attribute  def>> 
comp usage "mets: MissionElapsedTimeScale  " as E3  <<(T,blue) attribute>> {
##//doc//##
Define mission elapsed time scale starting at given UTC date time (in microsecond resolution)
- -
##//references//##
<&bar-trig> definitionalEpochInUTC <s>MissionElapsedTimeScale::definitionalEpochInUTC</s>
}
def "MissionElapsedTimeValue" as E4  <<(T,blue) attribute  def>> 
comp usage "spatialCF: CartesianSpatial3dCoordinateFrame  " as E5  <<(T,blue) attribute>> {
##//doc//##
Define Cartesian 3D coordinate systems for position and velocity\nCreate a velocity coordinate system from the spatial coordinate system through division by second
- -
##//references//##
<&bar-trig> mRefs <U+003D> (m, m, m) <s>CartesianSpatial3dCoordinateFrame::mRefs</s>
}
comp usage "velocityCF: CartesianVelocity3dCoordinateFrame  " as E6  <<(T,blue) attribute>> {
##//values//##
 <U+003D> spatialCF<U+002F>s
}
def "PositionAndVelocity" as E7  <<(T,blue) attribute  def>> 
def "AscentProfile" as E8  <<(T,blue) attribute  def>> 
comp usage "ascentProfile1: AscentProfile  " as E9  <<(T,blue) attribute>> {
##//doc//##
Example ascent profile
- -
##//attributes//##
<&bar-trig> samples <U+003D> (sample1, sample2, sample3) <s>AscentProfile::samples</s>
sample1: AscentSample
sample2: AscentSample
sample3: AscentSample
}
}
E3 - -:|> E2 
E9 - -:|> E8 
@enduml

