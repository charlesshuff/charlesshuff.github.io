F02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170" x="5" y="402.4631">rec usage "part2" as E4 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="421.531">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170" x="5" y="440.599">rec usage "part3" as E5 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="459.6669">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170" x="5" y="478.7348">rec usage "part4" as E6 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="497.8027">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170" x="5" y="516.8706">rec usage "part5" as E7 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="535.9385">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="170" x="5" y="555.0065">rec usage "part6" as E8 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="574.0744">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="355" x="5" y="593.1423">rec usage "&lt;i&gt;anyVehicleConfig&lt;/i&gt;: Vehicle" as E9 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="272" x="5" y="612.2102">rec usage "&lt;i&gt;subsystemA&lt;/i&gt;" as E10 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="346" x="5" y="631.2781">comp usage "subsystem1  " as E11 &lt;&lt;variant&gt;&gt;\n{</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93" x="9" y="650.346">Syntax Error?</text><!--MD5=[12cb5b786cf6f795ecf698c6ba3149c0]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "7a-Variant Configuration - General Concept" as E1   {
rec def "Vehicle" as E2  <<(T,blue) part  def>> {
}
rec usage "part1" as E3 {
}
rec usage "part2" as E4 {
}
rec usage "part3" as E5 {
}
rec usage "part4" as E6 {
}
rec usage "part5" as E7 {
}
rec usage "part6" as E8 {
}
rec usage "<i>anyVehicleConfig</i>: Vehicle" as E9 {
rec usage "<i>subsystemA</i>" as E10 {
comp usage "subsystem1  " as E11 <<variant>>\n{
}
comp usage "part1  " as E12 {
}
comp usage "part2  " as E13 {
}
comp usage "subsystem2  " as E14 <<variant>>\n{
}
comp usage "part2  " as E15 {
}
comp usage "part3  " as E16 {
}
}
rec usage "<i>subsystemB</i>" as E17 {
comp usage "subsystem3  " as E18 <<variant>>\n{
}
comp usage "part4  " as E19 {
}
comp usage "part5  " as E20 {
}
comp usage "subsystem4  " as E21 <<variant>>\n{
}
comp usage "part5  " as E22 {
}
comp usage "part6  " as E23 {
}
}
comp usage "<s>noname</s>  " as E24  << assert constraint>> {
##//operator expressions//##
 { subsystemA !<U+003D> subsystemA::subsystem2 | 			subsystemB <U+003D><U+003D> subsystemB::subsystem3 }
}
}
rec usage "vehicleConfigA:>anyVehicleConfig" as E25 {
rec usage "<&bar-trig> subsystemA <U+003D> subsystemA::subsystem1 <s>anyVehicleConfig::subsystemA</s>" as E26 {
}
rec usage "<&bar-trig> subsystemB <U+003D> subsystemB::subsystem3 <s>anyVehicleConfig::subsystemB</s>" as E27 {
}
}
rec usage "VehicleConfigB:>anyVehicleConfig" as E28 {
rec usage "<&bar-trig> subsystemA <U+003D> subsystemA::subsystem2 <s>anyVehicleConfig::subsystemA</s>" as E29 {
}
rec usage "<&bar-trig> subsystemB <U+003D> subsystemB::subsystem3 <s>anyVehicleConfig::subsystemB</s>" as E30 {
}
}
}
E11 *- - E12 
E12 - -||> E3 
E11 *- - E13 
E13 - -||> E4 
E14 *- - E15 
E15 - -||> E4 
E14 *- - E16 
E16 - -||> E5 
E18 *- - E19 
E19 - -||> E6 
E18 *- - E20 
E20 - -||> E7 
E21 *- - E22 
E22 - -||> E7 
E21 *- - E23 
E23 - -||> E8 
E9 - -:|> E2 
E26 -[thickness=5,#red]- E11 : =
E26 - -||> E10 
E27 -[thickness=5,#red]- E18 : =
E27 - -||> E17 
E25 - -|> E9 
E29 -[thickness=5,#red]- E14 : =
E29 - -||> E10 
E30 -[thickness=5,#red]- E18 : =
E30 - -||> E17 
E28 - -|> E9 
@enduml

