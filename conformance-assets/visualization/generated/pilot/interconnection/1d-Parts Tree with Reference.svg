@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "1d-Parts Tree with Reference" as E1   {
package "Definitions" as E2   {
rec def "Vehicle" as E3  <<(T,blue) part  def>> {
}
rec def "Trailer" as E4  <<(T,blue) part  def>> {
}
rec def "TrailerHitch" as E5  <<(T,blue) part  def>> {
}
rec def "HitchBall" as E6  <<(T,blue) part  def>> {
}
rec def "TrailerCoupler" as E7  <<(T,blue) part  def>> {
}
}
package "Usages" as E8   {
rec usage "vehicle_trailer_system" as E9 {
rec usage "vehicle1_c1: Vehicle" as E10 {
usage "hitchBall: HitchBall  " as E11  <<(T,blue) reference>> 
}
rec usage "trailerHitch: TrailerHitch" as E12 {
rec usage "hitchBall: HitchBall" as E13 {
}
rec usage "trailerCoupler: TrailerCoupler" as E14 {
}
}
rec usage "trailer1: Trailer" as E15 {
usage "trailerCoupler: TrailerCoupler  " as E16  <<(T,blue) reference>> 
}
}
}
}
E8 ..> E2 : <<import>>*
E11 - -:|> E6 
E10 - -:|> E3 
E11 -[thickness=5,#red]- E13 : =
E13 - -:|> E6 
E14 - -:|> E7 
E12 - -:|> E5 
E16 - -:|> E7 
E15 - -:|> E4 
@enduml

