@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "13b-Safety and Security Features Element Group" as E1   {
rec usage "vehicle1_c1" as E2 {
rec usage "interior" as E3 {
rec usage "alarm" as E4 {
}
rec usage "seatBelt" as E5 {
}
rec usage "frontSeat" as E6 {
}
rec usage "driverAirBag" as E7 {
}
}
rec usage "bodyAssy" as E8 {
rec usage "body" as E9 {
}
rec usage "bumper" as E10 {
}
rec usage "keylessEntry" as E11 {
}
}
}
package "Safety Features" as E12   {
note as E13
Parts that contribute to safety.
end note 
}
package "Security Features" as E14   {
note as E15
Parts that contribute to security.
end note 
}
package "Safety & Security Features" as E16   {
note as E17
Parts that contribute to safety AND
parts that contribute to security.

end note 
}
}
E13 .. E12 
E12 ..> E5 : <<import>>
E12 ..> E7 : <<import>>
E12 ..> E10 : <<import>>
E15 .. E14 
E14 ..> E4 : <<import>>
E14 ..> E11 : <<import>>
E17 .. E16 
E16 ..> E12 : <<import>>*
E16 ..> E14 : <<import>>*
@enduml

