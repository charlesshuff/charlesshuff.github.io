@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_04-Logical Expressions" as E1   {
rec def "Engine" as E2  <<(T,blue) part  def>> {
}
rec def "4CylEngine" as E3  <<(T,blue) part  def>> {
}
rec def "6CylEngine" as E4  <<(T,blue) part  def>> {
}
rec def "Transmission" as E5  <<(T,blue) part  def>> {
}
rec def "ManualTransmission" as E6  <<(T,blue) part  def>> {
}
rec def "AutomaticTransmission" as E7  <<(T,blue) part  def>> {
}
rec def "Vehicle" as E8  <<(T,blue) part  def>> {
comp usage "isHighPerformance: Boolean  " as E9  <<(T,blue) attribute>> {
}
rec usage "engine: Engine" as E10 {
}
rec usage "transmission: Transmission" as E11 {
}
comp usage "<s>noname</s>  " as E12  << assert constraint>> {
##//operator expressions//##
 { if isHighPerformance? engine istype <U+0027>6CylEngine<U+0027>			else engine istype <U+0027>4CylEngine<U+0027> }
}
comp usage "<s>noname</s>  " as E13  << assert constraint>> {
##//operator expressions//##
 { (engine istype <U+0027>4CylEngine<U+0027> and 			 transmission istype ManualTransmission) xor			(engine istype <U+0027>6CylEngine<U+0027> and			 transmission istype AutomaticTransmission) }
}
}
}
E3 - -|> E2 
E4 - -|> E2 
E6 - -|> E5 
E7 - -|> E5 
E10 - -:|> E2 
E11 - -:|> E5 
@enduml

