@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "12a-Dependency" as E1   {
package "Application Layer" as E2   {
}
package "Service Layer" as E3   {
}
package "Data Layer" as E4   {
}
comp usage "x  " as E5  <<(T,blue) attribute>> {
}
comp usage "y  " as E6  <<(T,blue) attribute>> {
}
comp usage "z  " as E7  <<(T,blue) attribute>> {
}
}
E2 ..>> E3 : <<depend>>
E3 ..>> E4 : <<depend>>
E7 ..>> E5 : <<depend>>
E7 ..>> E6 : <<depend>>
@enduml

