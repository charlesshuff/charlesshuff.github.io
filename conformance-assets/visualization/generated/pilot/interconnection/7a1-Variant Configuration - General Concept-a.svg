" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="402.4631">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178" x="5" y="421.531">rec usage "part6" as E14 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="440.599">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="409" x="5" y="459.6669">rec def "&lt;i&gt;SubsystemA&lt;/i&gt;" as E15  &lt;&lt;(T,blue) part  def&gt;&gt; {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="728" x="5" y="478.7348">rec usage "&lt;&amp;bar-trig&gt; &lt;i&gt;part3&lt;/i&gt; &lt;s&gt;7a1-Variant Configuration - General Concept-a::part3&lt;/s&gt;" as E16 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="497.8027">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="516.8706">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="408" x="5" y="535.9385">rec def "&lt;i&gt;SubsystemB&lt;/i&gt;" as E17  &lt;&lt;(T,blue) part  def&gt;&gt; {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="728" x="5" y="555.0065">rec usage "&lt;&amp;bar-trig&gt; &lt;i&gt;part5&lt;/i&gt; &lt;s&gt;7a1-Variant Configuration - General Concept-a::part5&lt;/s&gt;" as E18 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="574.0744">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6" x="5" y="593.1423">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="260" x="5" y="612.2102">rec usage "anyVehicleConfig" as E19 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="366" x="5" y="631.2781">rec usage "&lt;i&gt;subsystemA&lt;/i&gt;: SubsystemA" as E20 {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="440" x="5" y="650.346">comp usage "subsystem1: SubsystemA  " as E21 &lt;&lt;variant&gt;&gt;\n{</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93" x="9" y="669.414">Syntax Error?</text><!--MD5=[1748f84413e8e43b32281c7cf53e2fab]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "7a1-Variant Configuration - General Concept-a" as E1   {
rec usage "doX" as E2  <<(T,blue) action>> {
}

rec usage "doY" as E3  <<(T,blue) action>> {
}

rec usage "part1" as E4 {
}
rec usage "part2" as E5 {
}
rec usage "part3" as E6 {
portin "p1  " as E7  <<(T,blue) port>> 
}
rec usage "part4" as E8 {
}
rec usage "part5" as E9 {
portin "p2  " as E10  <<(T,blue) port>> 
rec usage "<i>doXorY</i>" as E11  <<variation>>\n << perform action>> {
}

}
rec usage "part6" as E14 {
}
rec def "<i>SubsystemA</i>" as E15  <<(T,blue) part  def>> {
rec usage "<&bar-trig> <i>part3</i> <s>7a1-Variant Configuration - General Concept-a::part3</s>" as E16 {
}
}
rec def "<i>SubsystemB</i>" as E17  <<(T,blue) part  def>> {
rec usage "<&bar-trig> <i>part5</i> <s>7a1-Variant Configuration - General Concept-a::part5</s>" as E18 {
}
}
rec usage "anyVehicleConfig" as E19 {
rec usage "<i>subsystemA</i>: SubsystemA" as E20 {
comp usage "subsystem1: SubsystemA  " as E21 <<variant>>\n{
}
comp usage "part1  " as E22 {
}
comp usage "part2  " as E23 {
}
comp usage "subsystem2: SubsystemA  " as E24 <<variant>>\n{
}
comp usage "part2  " as E25 {
}
comp usage "part3  " as E26 {
}
rec usage "<&bar-trig> ^<i>part3</i> <s>7a1-Variant Configuration - General Concept-a::part3</s>" as E27 {
portout "^p1  " as E28  <<(T,blue) port>> 
}
}
rec usage "<i>subsystemB</i>: SubsystemB" as E29 {
comp usage "subsystem3: SubsystemB  " as E30 <<variant>>\n{
}
comp usage "part4  " as E31 {
}
comp usage "part5  " as E32 {
}
comp usage "subsystem4: SubsystemB  " as E33 <<variant>>\n{
}
comp usage "part5  " as E34 {
}
comp usage "part6  " as E35 {
}
rec usage "<&bar-trig> ^<i>part5</i> <s>7a1-Variant Configuration - General Concept-a::part5</s>" as E36 {
portin "^p2  " as E37  <<(T,blue) port>> 
}
}
comp usage "<s>noname</s>  " as E38  << assert constraint>> {
##//operator expressions//##
 { subsystemA !<U+003D> subsystemA::subsystem2 | 			subsystemB <U+003D><U+003D> subsystemB::subsystem3 }
}
}
rec usage "vehicleConfigA:>anyVehicleConfig" as E39 {
rec usage "<&bar-trig> subsystemA <U+003D> subsystemA::subsystem1 <s>anyVehicleConfig::subsystemA</s>" as E40 {
}
rec usage "<&bar-trig> subsystemB <U+003D> subsystemB::subsystem3 <s>anyVehicleConfig::subsystemB</s>" as E41 {
rec usage "<&bar-trig> part5 <s>SubsystemB::part5</s>" as E42 {
rec usage "doXorY" as E43  << perform action>> {
}

}
}
}
rec usage "VehicleConfigB:>anyVehicleConfig" as E44 {
rec usage "<&bar-trig> subsystemA <U+003D> subsystemA::subsystem2 <s>anyVehicleConfig::subsystemA</s>" as E45 {
}
rec usage "<&bar-trig> subsystemB <U+003D> subsystemB::subsystem4 <s>anyVehicleConfig::subsystemB</s>" as E46 {
rec usage "<&bar-trig> part5 <s>SubsystemB::part5</s>" as E47 {
rec usage "doXorY" as E48  << perform action>> {
}

}
}
}
}
E11 - -> E2 : <<perform>>
E11 - -> E3 : <<perform>>
E16 - -||> E6 
E18 - -||> E9 
E21 *- - "1"E22 
E22 - -||> E4 
E21 *- - "1"E23 
E23 - -||> E5 
E24 *- - "1"E25 
E25 - -||> E5 
E24 *- - "1"E26 
E26 - -||> E16 
E27 - -||> E6 
E20 - -:|> E15 
E30 *- - "1"E31 
E31 - -||> E8 
E30 *- - "1"E32 
E32 - -||> E18 
E33 *- - "1"E34 
E34 - -||> E18 
E33 *- - "1"E35 
E35 - -||> E14 
E36 - -||> E9 
E29 - -:|> E17 
E28 -[thickness=3]- E37 
E40 -[thickness=5,#red]- E21 : =
E40 - -||> E20 
E41 -[thickness=5,#red]- E30 : =
E43 - -||> E11 
E42 - -||> E18 
E41 - -||> E29 
E39 - -|> E19 
E45 -[thickness=5,#red]- E24 : =
E45 - -||> E20 
E46 -[thickness=5,#red]- E33 : =
E48 - -||> E11 
E47 - -||> E18 
E46 - -||> E29 
E44 - -|> E19 
@enduml

