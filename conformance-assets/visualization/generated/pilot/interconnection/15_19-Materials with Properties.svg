@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_19-Materials with Properties" as E1   {
def "AtomicMassValue" as E2  <<(T,blue) attribute  def>> 
def "TensileStrengthUnit" as E3  <<(T,blue) attribute  def>> 
def "TensileStrengthValue" as E4  <<(T,blue) attribute  def>> 
comp usage "~<N/mm²> newton per square millimetre: TensileStrengthUnit  " as E5  <<(T,blue) attribute>> {
##//values//##
 <U+003D> N <U+002F> mm^2
}
rec def "Substance" as E6  <<(T,blue) part  def>> {
}
rec def "Material" as E7  <<(T,blue) part  def>> {
}
rec def "Metal" as E9  <<(T,blue) part  def>> {
comp usage "atomicMass: AtomicMassValue  " as E10  <<(T,blue) attribute>> {
}
}
def "MaterialFraction" as E11  <<(T,blue) attribute  def>> 
def "MassFractionValue" as E12  <<(T,blue) attribute  def>> 
rec def "Alloy" as E13  <<(T,blue) part  def>> {
comp usage "fractions: MaterialFraction  " as E14  <<(T,blue) attribute>> {
}
}
def "Iron" as E15  <<(T,blue) individual occurrence  def>> 
def "Carbon" as E16  <<(T,blue) individual occurrence  def>> 
def "Manganese" as E17  <<(T,blue) individual occurrence  def>> 
def "Steel_980" as E18  <<(T,blue) individual occurrence  def>> 
note as E8
The classification of materials into metals and alloys is grossly simplified and not exhaustive.
A more complete classification would include: ChemicalSubstance, PureMaterial, MixedMaterial,
Class, Ceramic, OrganicMaterial, AnorganicMaterial, Polymer, HybridMaterial, CompositeMaterial,
etc.

end note 
}
E5 - -:|> E3 
E7 - -|> E6 
E8 .. E1 
E9 - -|> E7 
E10 - -:|> E2 
E13 - -|> E7 
E14 - -:|> E11 
E15 - -|> E9 
E16 - -|> E9 
E17 - -|> E9 
E18 - -|> E13 
@enduml

