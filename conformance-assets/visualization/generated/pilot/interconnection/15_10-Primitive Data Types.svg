@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15.10-Primitive Data Types" as E1   {
def "UnsignedInteger" as E3  <<(T,blue) attribute  def>> 
def "UnsignedReal" as E4  <<(T,blue) attribute  def>> 
def "<i>ConditionColor</i>" as E5  <<(T,blue) enum  def>> 
def "ConditionLevel" as E6  <<(T,blue) attribute  def>> 
def "<i>SeverityEnum</i>" as E7  <<(T,blue) enum  def>> 
def "Diameter" as E8  <<(T,blue) attribute  def>> 
def "<i>DiameterChoice</i>" as E9  <<(T,blue) enum  def>> 
comp usage "aperatureDiameter: DiameterChoice  " as E10  <<(T,blue) attribute>> {
##//values//##
 <U+003D> DiameterChoice::small
}
note as E2
Primitive data types are defined in normative model libraries.
Any more specialized data types can be declared in user-defined
model libraries or models as needed.

end note 
}
E2 .. E1 
E7 - -|> E6 
E9 - -|> E8 
E10 - -:|> E9 
@enduml

