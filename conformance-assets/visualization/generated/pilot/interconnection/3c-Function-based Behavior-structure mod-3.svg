@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "3c-Function-based Behavior-structure mod-3" as E1   {
rec def "Vehicle" as E2  <<(T,blue) part  def>> {
}
rec def "VehicleFrame" as E3  <<(T,blue) part  def>> {
}
rec def "HitchBall" as E4  <<(T,blue) part  def>> {
}
rec def "Trailer" as E5  <<(T,blue) part  def>> {
}
rec def "TrailerFrame" as E6  <<(T,blue) part  def>> {
}
rec def "TrailerCoupler" as E7  <<(T,blue) part  def>> {
}
rec usage "vehicle: Vehicle" as E8 {
rec usage "vehicleFrame: VehicleFrame" as E9 {
rec usage "hitch: HitchBall" as E10 {
}
}
}
rec usage "trailer: Trailer" as E11 {
rec usage "trailerFrame: TrailerFrame" as E12 {
rec usage "coupler: TrailerCoupler" as E13 {
rec usage "hitch: HitchBall" as E14 {
}
}
}
}
rec usage "<s>noname</s>" as E15  <<(T,blue) action>> {
}

}
E10 - -:|> E4 
E9 - -:|> E3 
E8 - -:|> E2 
E14 - -:|> E4 
E13 - -:|> E7 
E12 - -:|> E6 
E11 - -:|> E5 
@enduml

