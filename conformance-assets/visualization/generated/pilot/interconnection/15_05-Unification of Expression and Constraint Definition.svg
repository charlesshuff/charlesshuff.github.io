@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_05-Unification of Expression and Constraint Definition" as E1   {
def "DiscBrakeConstraint" as E2  <<(T,blue) constraint  def>> 
def "DiscBrakeFitConstraint_Alt" as E3  <<(T,blue) constraint  def>> 
rec def "Vehicle_2" as E4  <<(T,blue) part  def>> {
comp usage "mass: MassValue  " as E5  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 1200 [kg]
}
comp usage "length: LengthValue  " as E6  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 4.82 [m]
}
rec usage "wheelAssy: WheelAssy" as E7 {
}
comp usage "discBrakeConstraint: DiscBrakeConstraint  " as E8  <<(T,blue) constraint>> {
##//doc//##
This constraint is computed, but not asserted. This means a tool can identify \nwhen it is violated without the model being inconsistent.
- -
##//parameters//##
<b>in</b> wheelAssy <U+003D> Vehicle<U+005F>2::wheelAssy
}
}
rec def "WheelAssy" as E9  <<(T,blue) part  def>> {
rec usage "wheel" as E10 {
}
rec usage "discBrakeAssy: DiscBrakeAssy" as E11 {
}
comp usage "discBrakeFitConstraint_Alt: DiscBrakeFitConstraint_Alt  " as E12  << assert constraint>> {
##//doc//##
This constraint is asserted to be true, which means that the model\nis inconsistent if it the constraint is violated.
- -
##//parameters//##
<b>in</b> discBrakeAssy <U+003D> WheelAssy::discBrakeAssy
<b>in</b> wheel <U+003D> WheelAssy::wheel
}
}
rec def "DiscBrakeAssy" as E13  <<(T,blue) part  def>> {
comp usage "radius: LengthValue  " as E14  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 95 [mm]
}
}
}
E7 - -:|> E9 
E8 - -:|> E2 
E11 - -:|> E13 
E12 - -:|> E3 
@enduml

