@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_11-Variable Length Collection Types" as E1   {
rec def "SparePart" as E2  <<(T,blue) part  def>> {
}
rec def "Person" as E3  <<(T,blue) part  def>> {
}
def "Bag<SparePart>" as E5  <<(T,blue) attribute  def>> 
def "List<Integer>" as E6  <<(T,blue) attribute  def>> 
def "Set<String>" as E7  <<(T,blue) attribute  def>> 
def "OrderedSet<Person>" as E8  <<(T,blue) attribute  def>> 
def "List<Set<Person>>" as E9  <<(T,blue) attribute  def>> 
def "Array<Real>[4]" as E10  <<(T,blue) attribute  def>> 
