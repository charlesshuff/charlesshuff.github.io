@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_03-Value Expression" as E1   {
rec def "Vehicle_1" as E2  <<(T,blue) part  def>> {
comp usage "mass: MassValue  " as E3  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 1200 [kg]
}
comp usage "length: LengthValue  " as E4  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 4.82 [m]
}
rec usage "leftFrontWheel: Wheel" as E5 {
}
rec usage "rightFrontWheel: Wheel" as E6 {
}
}
rec def "Wheel" as E7  <<(T,blue) part  def>> {
comp usage "hubDiameter: LengthValue  " as E8  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 18 [<U+0027>in<U+0027>]
}
comp usage "width: LengthValue  " as E9  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 245 [mm]
}
comp usage "outerDiameter: LengthValue  " as E10  <<(T,blue) attribute>> {
##//doc//##
This binds <U+0027>outDiameter<U+0027> to the result of a computed attribute.\nThere is no need to mark it as "derived".
- -
##//values//##
 <U+003D> (hubDiameter + 2 <U+002A> tire.height) [mm]
}
rec usage "tire: Tire" as E11 {
comp usage "^height: LengthValue  " as E12  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 45 [mm]
}
}
}
rec def "Tire" as E13  <<(T,blue) part  def>> {
comp usage "profileDepth: LengthValue  " as E14  <<(T,blue) attribute>> {
##//values//##
<b> default </b>6.0 [mm]
}
comp usage "hasLegalProfileDepth  " as E15  <<(T,blue) constraint>> {
##//operator expressions//##
 { profileDepth ><U+003D> 3.5 [mm] }
}
comp usage "height: LengthValue  " as E16  <<(T,blue) attribute>> {
##//values//##
 <U+003D> 45 [mm]
}
}
}
E5 - -:|> E7 
E6 - -:|> E7 
E11 - -:|> E13 
@enduml

