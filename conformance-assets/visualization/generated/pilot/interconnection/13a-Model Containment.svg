@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "13a-Model Containment" as E1   {
comp usage "BodyAndInteriorRequirements  " as E2  <<(T,blue) requirement>> {
}
comp usage "PowerTrainRequirements  " as E3  <<(T,blue) requirement>> {
}
package "Vehicle Model" as E4   {
note as E5
This package is used to represent a top-level "model".
There is no specific syntax for identifying a package
used in this way.

end note 
package "Vehicle1-Configuration" as E6   {
rec usage "<s>noname</s>" as E7  << accept action>> {
}

}
package "Vehicle Reference Model" as E8   {
note as E9
This package is used to represent a "model library".
There is no specific syntax for identifying a package
used in this way.

end note 
}
package "VehicleSubsystems" as E10   {
}
package "Body&Interior" as E11   {
}
package "PowerTrain" as E12   {
}
}
}
E2 ..> [*] : <<import>>
E5 .. E4 
E6 ..> [*] : <<import>>
E9 .. E8 
E8 ..> [*] : <<import>>
E8 ..> E10 : <<import>>
E10 ..> E11 : <<import>>
E11 ..> E2 : <<import>>
E10 ..> E12 : <<import>>
E12 ..> [*] : <<import>>
E12 ..> [*] : <<import>>
E12 ..> E3 : <<import>>
@enduml

