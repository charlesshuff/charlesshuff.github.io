@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "15_08-Range Restriction" as E1   {
rec def "HeadLightsTiltKnob" as E2  <<(T,blue) part  def>> {
comp usage "headLightsTile: LightBeamTiltAngleValue  " as E3  <<(T,blue) attribute>> {
}
}
def "LightBeamTiltAngleValue" as E4  <<(T,blue) attribute  def>> 
}
E1 ..> [*] : <<import>>
E3 - -:|> E4 
@enduml

