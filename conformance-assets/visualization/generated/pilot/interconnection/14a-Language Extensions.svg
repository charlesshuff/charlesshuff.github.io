@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

package "14a-Language Extensions" as E1   {
package "User Defined Extensions" as E2   {
def "<i>ClassificationLevel</i>" as E3  <<(T,blue) enum  def>> 
def "Classified" as E4  <<(T,blue) metadata  def>> 
}
rec usage "part_X" as E5 {
}
rec usage "part_Y" as E7 {
}
note as E6
""              ""
==== ""              ""Classified
- -
classificationLevel =  ClassificationLevel::conf
end note
note as E8
""              ""
==== ""              ""Classified
- -
classificationLevel =  ClassificationLevel::conf
end note
}
E1 ..> E2 : <<import>>*
E6 ..@ E5 
E8 ..@ E7 
@enduml

