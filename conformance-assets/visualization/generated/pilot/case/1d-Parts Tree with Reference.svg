@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "1d-Parts Tree with Reference" as E1   {
package "Definitions" as E2   {
comp def "Vehicle" as E3  <<(T,blue) part  def>> {
}
comp def "Trailer" as E4  <<(T,blue) part  def>> {
}
comp def "TrailerHitch" as E5  <<(T,blue) part  def>> {
}
comp def "HitchBall" as E6  <<(T,blue) part  def>> {
}
comp def "TrailerCoupler" as E7  <<(T,blue) part  def>> {
}
}
package "Usages" as E8   {
comp usage "vehicle_trailer_system  " as E9  <<(T,blue) part>> {
}
comp usage "vehicle1_c1: Vehicle  " as E10  <<(T,blue) part>> {
}
comp usage "trailerHitch: TrailerHitch  " as E11  <<(T,blue) part>> {
}
comp usage "hitchBall: HitchBall  " as E12  <<(T,blue) part>> {
}
comp usage "trailerCoupler: TrailerCoupler  " as E13  <<(T,blue) part>> {
}
comp usage "trailer1: Trailer  " as E14  <<(T,blue) part>> {
}
}
}
E8 ..> E2 : <<import>>*
E9 *- - E10 
E10 - -:|> E3 
E10 o- - E6 : hitchBall
E9 *- - E11 
