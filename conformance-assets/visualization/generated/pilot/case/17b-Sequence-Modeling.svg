@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "17b-Sequence-Modeling" as E1   {
package "PayloadDefinitions" as E2   {
comp def "Subscribe" as E3  <<(T,blue) item  def>> {
##//attributes//##
topic: String
}
comp usage "subscriber  " as E4  <<(T,blue) part>> {
}
comp def "Publish" as E5  <<(T,blue) item  def>> {
##//attributes//##
topic: String
- -
##//references//##
publication
}
comp def "Deliver" as E6  <<(T,blue) item  def>> {
##//references//##
publication
}
}
comp def "PubSubSequence" as E7  <<(T,blue) occurrence  def>> {
}
comp usage "producer  " as E8  <<(T,blue) part>> {
}
comp usage "server  " as E10  <<(T,blue) part>> {
##//successions//##
noname first null then null
noname first null then null
}
comp usage "subscribe_message.targetEvent" as E11  << event>> {
}
comp usage "publish_message.targetEvent" as E12  << event>> {
}
comp usage "deliver_message.sourceEvent" as E13  << event>> {
}
comp usage "consumer  " as E14  <<(T,blue) part>> {
##//successions//##
noname first null then null
}
comp usage "subscribe_message.sourceEvent" as E15  << event>> {
}
comp usage "deliver_message.targetEvent" as E16  << event>> {
}
}
E1 ..> E2 : <<import>>*
E3 o- - E4 
E7 *- - "1"E8 
E7 *- - "1"E10 
E10 o- - E11 
E11 ..> E12 
E10 o- - E12 
E12 ..> E13 
E10 o- - E13 
