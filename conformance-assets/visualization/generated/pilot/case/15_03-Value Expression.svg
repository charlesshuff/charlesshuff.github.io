@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_03-Value Expression" as E1   {
comp def "Vehicle_1" as E2  <<(T,blue) part  def>> {
##//attributes//##
length: LengthValue <U+003D> 4.82 [m]
mass: MassValue <U+003D> 1200 [kg]
}
comp usage "leftFrontWheel: Wheel  " as E3  <<(T,blue) part>> {
}
comp usage "rightFrontWheel: Wheel  " as E4  <<(T,blue) part>> {
}
comp def "Wheel" as E5  <<(T,blue) part  def>> {
##//attributes//##
hubDiameter: LengthValue <U+003D> 18 [<U+0027>in<U+0027>]
outerDiameter: LengthValue <U+003D> (hubDiameter + 2 <U+002A> tire.height) [mm]
width: LengthValue <U+003D> 245 [mm]
}
comp usage "tire: Tire  " as E6  <<(T,blue) part>> {
##//attributes//##
^height: LengthValue <U+003D> 45 [mm]
}
comp def "Tire" as E7  <<(T,blue) part  def>> {
##//attributes//##
height: LengthValue <U+003D> 45 [mm]
profileDepth: LengthValue<b> default </b>6.0 [mm]
}
comp usage "hasLegalProfileDepth  " as E8  <<(T,blue) constraint>> {
##//operator expressions//##
 { profileDepth ><U+003D> 3.5 [mm] }
}
}
E2 *- - E3 
E2 *- - E4 
E3 - -:|> E5 
E4 - -:|> E5 
E5 *- - "1"E6 
E6 - -:|> E7 
E7 *- - E8 
@enduml

