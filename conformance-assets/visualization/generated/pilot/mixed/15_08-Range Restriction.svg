reverse link E3 to E4--><g id="link_E3_E4"><path d="M216,149.882 C216,171.272 216,195.432 216,215.352 " fill="none" id="E3-backto-E4" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="216,136.642,212,142.642,216,148.642,220,142.642,216,136.642" style="stroke:#181818;stroke-width:1.0;"/></g><!--MD5=[b23d75c9297f3fa85c4a6988929f72fe]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_08-Range Restriction" as E1   {
comp def "HeadLightsTiltKnob" as E2  <<(T,blue) part  def>> {
##//attributes//##
headLightsTile: LightBeamTiltAngleValue
}
comp def "LightBeamTiltAngleValue" as E3  <<(T,blue) attribute  def>> {
##//attributes//##
<&bar-trig> angle: LightBeamTiltAngleValue <s>DataValue::self</s>
}
comp usage "<s>noname</s>  " as E4  << assert constraint>> {
##//operator expressions//##
 { angle ><U+003D> 50 [<U+0027>°<U+0027>] and angle <U+003C><U+003D> 80 [<U+0027>°<U+0027>] }
}
}
E1 ..> [*] : <<import>>
E3 *- - E4 
@enduml

