@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_11-Variable Length Collection Types" as E1   {
comp def "SparePart" as E2  <<(T,blue) part  def>> {
}
comp def "Person" as E3  <<(T,blue) part  def>> {
}
comp def "Bag<SparePart>" as E5  <<(T,blue) attribute  def>> {
}
comp usage "elements: SparePart  " as E6  <<(T,blue) part>> {
}
comp def "List<Integer>" as E7  <<(T,blue) attribute  def>> {
}
comp def "Set<String>" as E8  <<(T,blue) attribute  def>> {
##//attributes//##
<&bar-trig> elements: String <s>UniqueCollection::elements</s>
}
comp def "OrderedSet<Person>" as E9  <<(T,blue) attribute  def>> {
}
comp usage "elements: Person  " as E10  <<(T,blue) part>> {
}
comp def "List<Set<Person>>" as E11  <<(T,blue) attribute  def>> {
##//attributes//##
<&bar-trig> elements: Set <s>OrderedCollection::elements</s>
}
comp def "Array<Real>[4]" as E12  <<(T,blue) attribute  def>> {
##//attributes//##
<&bar-trig> elements: Real <s>OrderedCollection::elements</s>
<&bar-trig> dimensions <U+003D> 4 <s>Array::dimensions</s>
}
note as E4
Examples of declaring syntactic sugar-like names for instantiating collection types.
end note 
}
E4 .. E1 
E5 o- - E6 
E6 - -:|> E2 
E9 o- - E10 
E10 - -:|> E3 
@enduml

