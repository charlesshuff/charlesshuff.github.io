@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_04-Logical Expressions" as E1   {
comp def "Engine" as E2  <<(T,blue) part  def>> {
}
comp def "4CylEngine" as E3  <<(T,blue) part  def>> {
}
comp def "6CylEngine" as E4  <<(T,blue) part  def>> {
}
comp def "Transmission" as E5  <<(T,blue) part  def>> {
}
comp def "ManualTransmission" as E6  <<(T,blue) part  def>> {
}
comp def "AutomaticTransmission" as E7  <<(T,blue) part  def>> {
}
comp def "Vehicle" as E8  <<(T,blue) part  def>> {
##//attributes//##
isHighPerformance: Boolean
}
comp usage "engine: Engine  " as E9  <<(T,blue) part>> {
}
comp usage "transmission: Transmission  " as E10  <<(T,blue) part>> {
}
comp usage "<s>noname</s>  " as E11  << assert constraint>> {
##//operator expressions//##
 { if isHighPerformance? engine istype <U+0027>6CylEngine<U+0027>			else engine istype <U+0027>4CylEngine<U+0027> }
}
comp usage "<s>noname</s>  " as E12  << assert constraint>> {
##//operator expressions//##
 { (engine istype <U+0027>4CylEngine<U+0027> and 			 transmission istype ManualTransmission) xor			(engine istype <U+0027>6CylEngine<U+0027> and			 transmission istype AutomaticTransmission) }
}
}
E3 - -|> E2 
E4 - -|> E2 
E6 - -|> E5 
E7 - -|> E5 
E8 *- - "1"E9 
E9 - -:|> E2 
E8 *- - "1"E10 
E10 - -:|> E5 
E8 *- - E11 
E8 *- - E12 
@enduml

