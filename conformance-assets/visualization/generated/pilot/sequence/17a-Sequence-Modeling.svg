@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam roundcorner 20
skinparam BoxPadding 20
skinparam SequenceBoxBackgroundColor #white
skinparam style strictuml
skinparam maxMessageSize 100

box "PubSubSequence"
participant "producer" as E1  << part>> 
participant "server" as E2  << part>> 
participant "consumer" as E3  << part>> 
end box
E3 ->> E2 : subscribe_message
E1 ->> E2 : publish_message
E2 ->> E3 : deliver_message
@enduml

