@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "MassAnalysisCase" as E2  << analysis def>> {
portin "vehicle" as E3  
}

note as E1
...
end note 
rec def "AnalysisPlan" as E4  << analysis def>> {
portin "vehicle" as E5  
rec usage "massAnalysisCase" as E6  << analysis>> {
portout "mass" as E8  
}

}

note as E7
By default, the subject of a nested analysis case bound to that
of its containing analysis case or analysis case definition.

end note 
E6 - -:|> E2 
E7 .. E6 
rec usage "analysisPlan" as E9  << analysis>> {
portin "vehicle" as E10  
}

E9 - -:|> E4 
@enduml

