@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "<s>noname</s>" as E1  << perform action>> {
rec usage "connect trailer to vehicle" as E2  <<(T,blue) action>> {
}

rec usage "disconnect trailer from vehicle" as E3  <<(T,blue) action>> {
}

}

E2 ..> E3 
@enduml

