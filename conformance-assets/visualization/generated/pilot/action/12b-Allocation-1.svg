@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "GenerateTorque" as E1  <<(T,blue) action  def>> {
portout "torque" as E2  
}

rec usage "generateTorque" as E3  << perform action>> {
}

E3 - -:|> E1 
rec usage "providePower" as E4  <<(T,blue) action>> {
rec usage "generateTorque" as E5  <<(T,blue) action>> {
}

}

E5 - -:|> E1 
rec usage "providePower.generateTorque" as E6  << perform>> {
}

E6 - -|> E5 
E6 - -||> E3 
rec usage "providePower.generateTorque" as E7  << perform>> {
}

E7 - -|> E5 
@enduml

