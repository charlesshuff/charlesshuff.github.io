@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "generate torque" as E1  << perform action>> {
}

rec def "Generate Torque" as E2  <<(T,blue) action  def>> {
}

E1 - -:|> E2 
rec usage "provide power" as E3  <<(T,blue) action>> {
rec usage "generate torque" as E4  <<(T,blue) action>> {
}

}

note as E5
...
end note 
E5 .. E4 
rec usage "provide power" as E6  << perform>> {
rec usage "^generate torque" as E7  <<(T,blue) action>> {
}

}

E6 - -|> E3 
E5 .. E7 
rec usage "provide power.generate torque" as E8  << perform>> {
}

E8 - -|> E7 
E8 - -||> E1 
note as E9
The optional requirement ID  of this requirement ('1') is given after the keyword "id" (using name syntax).
Every requirement is parameterized by a "subject". The "subject" of this requirement is implicitly "Anything".

end note 
note as E10
The actual mass shall be less than or equal to the required mass.
end note 
@enduml

