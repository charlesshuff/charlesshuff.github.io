@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "MassTest" as E2  << verification def>> {
}

note as E1
The actual mass shall be less than or equal to the required mass limit.
end note 
rec usage "vehicleMassTest" as E3  << verification>> {
portin "testVehicle" as E4  
rec usage "collectData" as E5  <<(T,blue) action>> {
portin "testVehicle" as E6  
portout "massMeasured" as E7  
}

rec usage "processData" as E8  <<(T,blue) action>> {
portin "massMeasured" as E9  
portout "massProcessed" as E10  
}

rec usage "evaluateData" as E11  <<(T,blue) action>> {
portin "massProcessed" as E12  
portout "verdict" as E13  
}

portout "verdict" as E14  
}

E3 - -:|> E2 
E6 -[thickness=5,#red]- E4 : =
E14 -[thickness=5,#red]- E13 : =
rec usage "vehicleMassTest" as E15  << perform>> {
portin "testVehicle" as E16  
rec usage "^collectData" as E17  <<(T,blue) action>> {
portin "testVehicle" as E18  
portout "massMeasured" as E19  
}

}

E15 - -|> E3 
E18 -[thickness=5,#red]- E4 : =
rec usage "vehicleMassTest.collectData" as E20  << perform>> {
portin "testVehicle" as E21  
portout "massMeasured" as E22  
}

E20 - -|> E17 
@enduml

