@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "Acceleration" as E1  <<(T,blue) calculation  def>> {
portin "p" as E2  
portin "m" as E3  
portin "v" as E4  
portout "result" as E5  
}

rec def "Velocity" as E6  <<(T,blue) calculation  def>> {
portin "v0" as E7  
portin "a" as E8  
portin "dt" as E9  
portout "result" as E10  
}

rec def "Position" as E11  <<(T,blue) calculation  def>> {
portin "x0" as E12  
portin "v" as E13  
portin "dt" as E14  
portout "result" as E15  
}

rec def "StraightLineDynamics" as E16  <<(T,blue) action  def>> {
portin "power" as E17  
portin "mass" as E18  
portin "delta_t" as E19  
portin "x_in" as E20  
portin "v_in" as E21  
portout "x_out" as E22  
portout "v_out" as E23  
portout "a_out" as E24  
}

rec def "DynamicsAnalysis" as E25  << analysis def>> {
portin "vehicle" as E26  
portin "powerProfile" as E27  
portin "initialPosition" as E28  
portin "initialSpeed" as E29  
portin "deltaT" as E30  
portout "accelerationProfile" as E31  
rec usage "<s>noname</s>" as E32  <<(T,blue) for loop action>> {
portin "seq" as E33  
rec usage "body" as E34  <<(T,blue) action>> {
rec usage "dynamics" as E35  << perform action>> {
portin "power" as E36  
portin "mass" as E37  
portin "delta_t" as E38  
portin "x_in" as E39  
portin "v_in" as E40  
portout "^x_out" as E41  
portout "^v_out" as E42  
portout "^a_out" as E43  
}

}

}

}

E35 - -:|> E16 
@enduml

