@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "providePower" as E1  <<(T,blue) action>> {
rec usage "generateTorque" as E2  <<(T,blue) action>> {
}

}

rec usage "providePower.generateTorque" as E3  << perform>> {
}

E3 - -|> E2 
rec usage "providePower.generateTorque" as E4  << perform>> {
}

E4 - -|> E2 
@enduml

