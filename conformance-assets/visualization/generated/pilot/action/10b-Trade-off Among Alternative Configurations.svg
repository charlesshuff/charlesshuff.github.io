link E2 to E1--><g id="link_E2_E1"><path d="M239.22,68.2199 C256.365,72.5099 274.6625,77.0849 292.7088,81.5961 C301.7319,83.8518 310.6922,86.0915 319.4142,88.2716 C320.5045,88.5441 321.591,88.8157 322.6735,89.0863 " fill="none" id="E2-E1" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--MD5=[7c9a5957768c7027d0787e51c6ffe061]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "EngineEvaluation" as E1  <<(T,blue) calculation  def>> {
portin "power" as E3  
portin "mass" as E4  
portin "efficiency" as E5  
portin "cost" as E6  
portout "evaluation" as E7  
}

note as E2
Evaluation function with criteria power, mass, efficency and cost.
end note 
E2 .. E1 
rec usage "engineTradeStudy" as E8  << analysis>> {
portin "studyAlternatives" as E9  
rec usage "evaluationFunction" as E10  <<(T,blue) calculation>> {
portin "anEngine" as E11  
rec usage "powerRollup" as E12  <<(T,blue) calculation>> {
portin "engine" as E13  
portout "power" as E14  
}

rec usage "massRollup" as E15  <<(T,blue) calculation>> {
portin "engine" as E16  
portout "mass" as E17  
}

rec usage "efficiencyRollup" as E18  <<(T,blue) calculation>> {
portin "engine" as E19  
portout "efficiency" as E20  
}

rec usage "costRollup" as E21  <<(T,blue) calculation>> {
portin "engine" as E22  
portout "cost" as E23  
}

portout "result" as E24  
}

portout "selectedAlternative" as E25  
}

@enduml

