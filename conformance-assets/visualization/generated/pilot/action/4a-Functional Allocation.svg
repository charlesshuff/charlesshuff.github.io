@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "<s>noname</s>" as E1  << perform>> {
portin "fuelCmd" as E3  
}

note as E2
This allocates the action '3a-Function-based Behavior-1'::'provide power' as an enacted
performance of 'vehicle_c1_functional_allocation'.

end note 
E2 .. E1 
rec usage "null.null" as E4  << perform>> {
portin "fuelCmd" as E6  
portout "engineTorque" as E7  
}

note as E5
This allocates one of the sub-steps of 'provide power' to a sub-part of vehicle_c1.

end note 
E5 .. E4 
rec usage "null.null" as E8  << perform>> {
portin "engineTorque" as E9  
portout "transmissionTorque" as E10  
}

rec usage "null.null" as E11  << perform>> {
portin "transmissionTorque" as E12  
portout "driveshaftTorque" as E13  
}

rec usage "null.null" as E14  << perform>> {
portin "driveshaftTorque" as E15  
portout "wheelTorque1" as E16  
portout "wheelTorque2" as E17  
}

@enduml

