@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec def "PumpFuel" as E1  <<(T,blue) action  def>> {
portin "fuelIn" as E2  
portout "fuelOut" as E3  
}

rec usage "pumpFuel" as E5  << perform action>> {
portin "fuelIn" as E6  
portout "fuelOut" as E7  
}

note as E4
Storage Element
end note 
E5 - -:|> E1 
note as E8
Storage Element
end note 
note as E9
Stored Item
end note 
note as E10
isConserved = true
end note 
@enduml

