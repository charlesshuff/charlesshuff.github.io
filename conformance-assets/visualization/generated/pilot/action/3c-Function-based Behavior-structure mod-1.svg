@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "<s>noname</s>" as E1  <<(T,blue) action>> {
rec usage "destroy connection of trailer to vehicle" as E2  <<(T,blue) action>> {
port "occ" as E3  
}

}

@enduml

