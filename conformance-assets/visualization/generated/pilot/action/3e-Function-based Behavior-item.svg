@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "assemble vehicle" as E1  << perform action>> {
rec usage "assemble transmission into vehicle" as E2  <<(T,blue) action>> {
portin "vehicle assy without transmission or engine" as E3  
portin "transmission" as E4  
portout "vehicle assy without engine" as E5  
}

rec usage "assemble engine into vehicle" as E6  <<(T,blue) action>> {
portin "vehicle assy without engine" as E7  
portin "engine" as E8  
portout "assembledVehicle" as E9  
}

}

E5 -[thickness=5,#red]- E3 : =
E5 - -> E7 
E9 -[thickness=5,#red]- E7 : =
rec usage "providePower" as E11  << perform action>> {
}

note as E10
Note: An in item one context can become a part in an other.

end note 
@enduml

