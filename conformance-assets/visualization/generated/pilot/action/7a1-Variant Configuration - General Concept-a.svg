@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "doX" as E1  <<(T,blue) action>> {
}

rec usage "doY" as E2  <<(T,blue) action>> {
}

rec usage "<i>doXorY</i>" as E3  <<variation>>\n << perform action>> {
}

E3 - -> E1 : <<perform>>
E3 - -> E2 : <<perform>>
rec usage "doXorY" as E6  << perform action>> {
}

E6 - -||> E3 
rec usage "doXorY" as E7  << perform action>> {
}

E7 - -||> E3 
@enduml

