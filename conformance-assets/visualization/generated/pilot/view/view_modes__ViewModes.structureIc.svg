@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "Car" as E1  <<(T,blue) part  def>> {
rec usage "lamp" as E2  << exhibit state>> {
}

rec usage "brew" as E3  << perform action>> {
}

}
rec usage "car: Car" as E4 {
}
E4 - -:|> E1 
@enduml

