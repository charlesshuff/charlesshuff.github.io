@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp def "Drive" as E1  <<(T,blue) use case  def>> {
##//subject//##
car
}
comp usage "<size:30><&person></size> driver  " as E2  <<(T,blue) part>> {
}
comp def "Park" as E3  <<(T,blue) use case  def>> {
##//subject//##
car
}
E1 - - E2 
@enduml

