@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "Fleet" as E1   {
comp usage "truck  " as E2  <<(T,blue) part>> {
}
comp usage "van  " as E3  <<(T,blue) part>> {
}
comp usage "cargo  " as E4  <<(T,blue) part>> {
}
}
comp usage "truck  " as E5  <<(T,blue) part>> {
}
comp usage "van  " as E6  <<(T,blue) part>> {
}
comp usage "cargo  " as E7  <<(T,blue) part>> {
}
comp usage "cargo  " as E8  <<(T,blue) part>> {
}
E3 *- - E4 
E6 *- - E7 
@enduml

