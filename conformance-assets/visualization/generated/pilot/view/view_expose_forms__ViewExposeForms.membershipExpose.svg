@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp usage "vehicle  " as E1  <<(T,blue) part>> {
##//attributes//##
mass
}
comp usage "engine: Engine  " as E2  <<(T,blue) part>> {
}
comp usage "wheels: Wheel  " as E3  <<(T,blue) part>> {
}
comp usage "hub  " as E4  <<(T,blue) part>> {
}
E1 *- - E2 
E1 *- - "4"E3 
E3 *- - E4 
@enduml

