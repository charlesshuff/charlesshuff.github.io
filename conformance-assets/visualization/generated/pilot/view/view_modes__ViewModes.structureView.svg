@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp def "Car" as E1  <<(T,blue) part  def>> {
}
rec usage "lamp" as E2  << exhibit state>> {
}

rec usage "brew" as E3  << perform action>> {
}

comp usage "car: Car  " as E4  <<(T,blue) part>> {
}
E1 o- - E2 
E1 o- - E3 
E4 - -:|> E1 
@enduml

