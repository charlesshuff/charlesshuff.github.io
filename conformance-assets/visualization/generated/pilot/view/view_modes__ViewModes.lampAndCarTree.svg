@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp def "Car" as E1  <<(T,blue) part  def>> {
}
comp usage "lamp: Lamp  " as E2  << exhibit state>> {
}
comp usage "brew: Brew  " as E3  << perform action>> {
}
comp def "Lamp" as E4  <<(T,blue) state  def>> {
##//transitions//##
off_on
}
comp usage "off  " as E5  <<(T,blue) state>> {
}
comp usage "on  " as E6  <<(T,blue) state>> {
}
E1 o- - E2 
E1 o- - E3 
E2 - -:|> E4 
E4 *- - E5 
E4 *- - E6 
@enduml

