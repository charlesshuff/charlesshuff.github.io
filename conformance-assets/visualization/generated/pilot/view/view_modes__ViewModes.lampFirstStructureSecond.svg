@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

rec def "Lamp" as E1  <<(T,blue) state  def>> {
rec usage "off" as E2  <<(T,blue) state>> {
}

rec usage "on" as E3  <<(T,blue) state>> {
}

}

comp usage "car: Car  " as E4  <<(T,blue) part>> {
}
E2  - -> E3 
@enduml

