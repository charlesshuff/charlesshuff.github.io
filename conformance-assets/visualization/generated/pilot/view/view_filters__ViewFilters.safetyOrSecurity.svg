@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp usage "mass  " as E1 <<#Safety>>{
}
comp usage "drive  " as E2  <<(T,blue) action>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "alarm  " as E3 <<#Security>>{
}
comp usage "seatBelt[2]  " as E4  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "driverAirBag  " as E5  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  false
}
comp usage "bumper  " as E6  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "keylessEntry  " as E7 <<#Security>>{
}
@enduml

