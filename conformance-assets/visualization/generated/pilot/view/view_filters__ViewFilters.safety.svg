@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp usage "mass  " as E1 <<#Safety>>{
}
comp usage "drive  " as E2  <<(T,blue) action>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "seatBelt[2]  " as E3  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "driverAirBag  " as E4  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  false
}
comp usage "bumper  " as E5  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
@enduml

