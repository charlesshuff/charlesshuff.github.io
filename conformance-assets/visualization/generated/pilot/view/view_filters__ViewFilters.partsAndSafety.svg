@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp usage "seatBelt  " as E1  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
comp usage "driverAirBag  " as E2  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  false
}
comp usage "bumper  " as E3  <<(T,blue) part>> {
##//metadata//##
""Safety""
""  ""isMandatory =  true
}
@enduml

