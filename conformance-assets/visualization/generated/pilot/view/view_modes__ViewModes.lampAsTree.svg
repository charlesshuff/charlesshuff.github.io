@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

comp def "Lamp" as E1  <<(T,blue) state  def>> {
##//transitions//##
off_on
}
comp usage "off  " as E2  <<(T,blue) state>> {
}
comp usage "on  " as E3  <<(T,blue) state>> {
}
E1 *- - E2 
E1 *- - E3 
@enduml

