@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "14a-Language Extensions" as E1   {
package "User Defined Extensions" as E2   {
comp def "<i>ClassificationLevel</i>" as E3  <<(T,blue) enum  def>> {
##//enums//##
uncl
conf
secret
}
comp def "Classified" as E4  <<(T,blue) metadata  def>> {
##//attributes//##
classificationLevel: ClassificationLevel
}
}
comp usage "part_X  " as E5  <<(T,blue) part>> {
##//metadata//##
""Classified""
""  ""classificationLevel =  ClassificationLevel::conf
}
comp usage "part_Y  " as E6  <<(T,blue) part>> {
##//metadata//##
""Classified""
""  ""classificationLevel =  ClassificationLevel::conf
}
}
E1 ..> E2 : <<import>>*
@enduml

