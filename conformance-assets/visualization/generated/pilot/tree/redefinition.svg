@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "Redefinition" as E1   {
comp def "A" as E2  <<(T,blue) part  def>> {
##//attributes//##
m: Real
}
comp usage "b: A  " as E3  <<(T,blue) part>> {
##//attributes//##
<&bar-trig> m <U+003D> 1.0 <s>A::m</s>
}
}
E3 - -:|> E2 
@enduml

