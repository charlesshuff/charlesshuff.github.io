@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "RequirementSubject" as E1   {
comp def "Vehicle" as E2  <<(T,blue) part  def>> {
}
comp def "MassLimit" as E3  <<(T,blue) requirement  def>> {
##//constraints//##
<b>assume</b> { 1 > 0 }
<b>require</b> { 1 <U+003C><U+003D> 2 }
}
comp usage "vehicle" as E4 <<subject>>{
}
}
E3 o- - E4 
E4 - -:|> E2 
@enduml

