@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "CompositePart" as E1   {
comp def "Engine" as E2  <<(T,blue) part  def>> {
}
comp def "Car" as E3  <<(T,blue) part  def>> {
}
comp usage "engine: Engine  " as E4  <<(T,blue) part>> {
}
}
E3 *- - E4 
E4 - -:|> E2 
@enduml

