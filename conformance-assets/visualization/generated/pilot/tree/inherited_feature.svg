@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "InheritedFeature" as E1   {
comp def "Base" as E2  <<(T,blue) part  def>> {
##//attributes//##
mass
}
comp usage "wheel  " as E3  <<(T,blue) part>> {
}
comp def "Derived" as E4  <<(T,blue) part  def>> {
##//attributes//##
<&bar-trig> mass <s>Base::mass</s>
}
}
E2 *- - E3 
E4 - -|> E2 
@enduml

