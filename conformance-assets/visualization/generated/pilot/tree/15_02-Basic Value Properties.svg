@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_02-Basic Value Properties" as E1   {
comp def "LengthValue" as E2  <<(T,blue) attribute  def>> {
##//doc//##
Real world user models would use a quantity type\nfrom the library model. A attribute def is defined\nhere to show that it is possible.
}
comp def "Tire" as E3  <<(T,blue) part  def>> {
##//attributes//##
hubDiameter: LengthValue
manufacturer: String
width: Integer
}
comp usage "frenchTire: Tire  " as E4  <<(T,blue) part>> {
##//attributes//##
<&bar-trig> manufacturer <U+003D> "Michelin" <s>Tire::manufacturer</s>
<&bar-trig> hubDiameter <U+003D> 18.0 <s>Tire::hubDiameter</s>
<&bar-trig> width <U+003D> 245 <s>Tire::width</s>
}
}
E4 - -:|> E3 
@enduml

