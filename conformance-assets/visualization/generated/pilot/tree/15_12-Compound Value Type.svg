@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15_12-Compound Value Type" as E1   {
comp def "PositionVector" as E3  <<(T,blue) attribute  def>> {
##//attributes//##
x: Real
y: Real
z: Real
}
comp def "LengthValue" as E4  <<(T,blue) attribute  def>> {
}
comp def "TireInfo" as E5  <<(T,blue) attribute  def>> {
##//attributes//##
hubDiameter: LengthValue
manufacturer: String
placement: PositionVector
width: Integer
}
comp usage "frenchTireInfo: TireInfo  " as E6  <<(T,blue) attribute>> {
##//attributes//##
<&bar-trig> manufacturer <U+003D> "Michelin" <s>TireInfo::manufacturer</s>
<&bar-trig> hubDiameter <U+003D> 18.0[<U+0027>in<U+0027>] <s>TireInfo::hubDiameter</s>
<&bar-trig> width <U+003D> 245 <s>TireInfo::width</s>
}
note as E2
Real world user models would use quantity and vector types
from library models. They are included here for the purpose
of showing how such attribute defs can be defined.

end note 
}
E2 .. E1 
E6 - -:|> E5 
@enduml

