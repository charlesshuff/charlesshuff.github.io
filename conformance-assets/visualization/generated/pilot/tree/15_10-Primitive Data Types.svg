@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "15.10-Primitive Data Types" as E1   {
comp def "UnsignedInteger" as E3  <<(T,blue) attribute  def>> {
##//doc//##
Mathematically, unsigned integers are just natural numbers (non<U+002D>negative integers).
}
comp def "UnsignedReal" as E4  <<(T,blue) attribute  def>> {
##//doc//##
Example of restriction of the base Real datatype.
- -
##//attributes//##
<&bar-trig> x: Real <s>DataValue::self</s>
}
comp usage "<s>noname</s>  " as E5  << assert constraint>> {
##//operator expressions//##
 { x ><U+003D> 0.0 }
}
comp def "<i>ConditionColor</i>" as E6  <<(T,blue) enum  def>> {
##//doc//##
Enumerations are defined as an implicit restriction of the extent of the\nenumeration type to the listed enumeration values.\nNote: Enumerations are currently limited to attributes.
- -
##//enums//##
red
yellow
green
}
comp def "ConditionLevel" as E7  <<(T,blue) attribute  def>> {
##//attributes//##
associatedColor: ConditionColor
}
comp def "<i>SeverityEnum</i>" as E8  <<(T,blue) enum  def>> {
##//enums//##
danger
warning
normal
}
comp def "Diameter" as E9  <<(T,blue) attribute  def>> {
}
comp def "<i>DiameterChoice</i>" as E10  <<(T,blue) enum  def>> {
##//enums//##
small <U+003D> 60 [SI::mm]
medium <U+003D> 70 [SI::mm]
large <U+003D> 80 [SI::mm]
}
comp usage "aperatureDiameter: DiameterChoice  " as E11  <<(T,blue) attribute>> {
##//values//##
 <U+003D> DiameterChoice::small
}
note as E2
Primitive data types are defined in normative model libraries.
Any more specialized data types can be declared in user-defined
model libraries or models as needed.

end note 
}
E2 .. E1 
E4 *- - E5 
E8 - -|> E7 
E10 - -|> E9 
E11 - -:|> E10 
@enduml

