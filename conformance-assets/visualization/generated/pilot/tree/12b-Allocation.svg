@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "12b-Allocation" as E1   {
package "LogicalModel" as E2   {
comp usage "providePower  " as E3  <<(T,blue) action>> {
}
comp usage "generateTorque  " as E4  <<(T,blue) action>> {
}
comp usage "torqueGenerator  " as E5  <<(T,blue) part>> {
}
}
package "PhysicalModel" as E7   {
comp usage "powerTrain  " as E8  <<(T,blue) part>> {
}
comp usage "engine  " as E9  <<(T,blue) part>> {
}
}
}
E1 ..> E2 : <<import>>*
E3 *- - E4 
E5 - -> E4 : <<perform>>
E1 ..> E7 : <<import>>*
E8 *- - E9 
E9 - -> E4 : <<perform>>
E5 -[thickness=5,dotted]-> E8 
@enduml

