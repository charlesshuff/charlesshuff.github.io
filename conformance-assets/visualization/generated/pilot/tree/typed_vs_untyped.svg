@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "TypedVsUntyped" as E1   {
comp def "Motor" as E2  <<(T,blue) part  def>> {
}
comp def "Vehicle" as E3  <<(T,blue) part  def>> {
##//references//##
untyped
}
comp usage "motor: Motor  " as E4  <<(T,blue) part>> {
}
}
E3 *- - E4 
E4 - -:|> E2 
@enduml

