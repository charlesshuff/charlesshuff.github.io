@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

package "3c-Function-based Behavior-structure mod-3" as E1   {
comp def "Vehicle" as E2  <<(T,blue) part  def>> {
}
comp def "VehicleFrame" as E3  <<(T,blue) part  def>> {
}
comp def "HitchBall" as E4  <<(T,blue) part  def>> {
}
comp def "Trailer" as E5  <<(T,blue) part  def>> {
}
comp def "TrailerFrame" as E6  <<(T,blue) part  def>> {
}
comp def "TrailerCoupler" as E7  <<(T,blue) part  def>> {
}
comp usage "vehicle: Vehicle  " as E8  <<(T,blue) part>> {
}
comp usage "vehicleFrame: VehicleFrame  " as E9  <<(T,blue) part>> {
}
comp usage "hitch: HitchBall  " as E10  <<(T,blue) part>> {
}
comp usage "trailer: Trailer  " as E11  <<(T,blue) part>> {
}
comp usage "trailerFrame: TrailerFrame  " as E12  <<(T,blue) part>> {
}
comp usage "coupler: TrailerCoupler  " as E13  <<(T,blue) part>> {
}
comp usage "hitch: HitchBall  " as E14  <<(T,blue) part>> {
}
comp usage "<s>noname</s>  " as E15  <<(T,blue) action>> {
##//successions//##
noname first connect trailer to vehicle then disconnect trailer from vehicle
}
}
E8 - -:|> E2 
E8 *- - E9 
E9 - -:|> E3 
E9 *- - E10 
E10 - -:|> E4 
E11 - -:|> E5 
E11 *- - E12 
E12 - -:|> E6 
E12 *- - E13 
E13 - -:|> E7 
E13 o- - E14 
E14 - -:|> E4 
@enduml

