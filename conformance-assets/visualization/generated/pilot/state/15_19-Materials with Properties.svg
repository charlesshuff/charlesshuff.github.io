ill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117" x="12" y="131.1331">CompositeMaterial,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21" x="12" y="148.8391">etc.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="12" y="166.5451"> </text></g><g id="elem_E2"><path d="M356.5,68 L356.5,113.412 L664.5,113.412 L664.5,78 L654.5,68 L356.5,68 " fill="#FEFFDD" filter="url(#f13oos9thyj7dm)" style="stroke:#181818;stroke-width:0.5;"/><path d="M654.5,68 L654.5,78 L664.5,78 L654.5,68 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287" x="362.5" y="86.897">Particular example of high tensile strength steel.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="362.5" y="104.603"> </text></g><!--MD5=[efb1096af52b9ac210acc94d1d0a0c2c]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

note as E1
The classification of materials into metals and alloys is grossly simplified and not exhaustive.
A more complete classification would include: ChemicalSubstance, PureMaterial, MixedMaterial,
Class, Ceramic, OrganicMaterial, AnorganicMaterial, Polymer, HybridMaterial, CompositeMaterial,
etc.

end note 
note as E2
Particular example of high tensile strength steel.

end note 
@enduml

