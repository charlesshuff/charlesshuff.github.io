@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

rec usage "transmissionState" as E1  << exhibit state>> {
rec usage "1stGear" as E2  <<(T,blue) state>> {
}

rec usage "2ndGear" as E3  <<(T,blue) state>> {
}

rec usage "3rdGear" as E4  <<(T,blue) state>> {
}

rec usage "4thGear" as E5  <<(T,blue) state>> {
}

desc "transmissionState" as E1  : **entry** 
[*] - -> E2 
}

E2  - -> E3 
E3  - -> E4 
E4  - -> E5 
note as E6
Solve for the required engine power as a function of time
to support the nominal scenarios.

Note: Vehicle force = power/speed
Note: EngineRPM * EngineGearRatio/WheelRPM = constant

end note 
note as E7
Solve the engine equations to determine how much fuel is
consumed. The engine RPM is a function of the speed of the
vehicle and the gear state.

end note 
@enduml

