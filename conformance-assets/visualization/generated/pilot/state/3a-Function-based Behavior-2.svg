"#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="1068.5" y="157.397">Enable torque generation.</text></g><g id="elem_E5"><path d="M1275,138.5 L1275,166.206 L1455,166.206 L1455,148.5 L1445,138.5 L1275,138.5 " fill="#FEFFDD" filter="url(#fnzcis3o6j7uo)" style="stroke:#181818;stroke-width:0.5;"/><path d="M1445,138.5 L1445,148.5 L1455,148.5 L1445,138.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="1281" y="157.397">Disable torque generation.</text></g><!--MD5=[7cee986e2ca3bd9645d1566a6780b2f8]
@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

note as E1
source: item 4-12.2 torque
symbol(s): `T`, `M_Q`
application domain: generic
name: Torque
quantity dimension: L^2*M^1*T^-2
measurement unit(s): N*m, kg*m^2*s^-2
tensor order: 0
definition: quantity described by the scalar product: `T = vec(M)*vec(e_Q)` where `vec(M)` is moment of force (item 4-12.1) and `vec(e_Q)` is unit vector of direction with respect to which the torque is considered
remarks: For example, torque is the twisting moment of force with respect to the longitudinal axis of a beam or shaft.

end note 
note as E2
The binding connector shorthand can be used on action parameters.

end note 
note as E3
The following uses a shorthand for a sequence of successions.
The source of the first first is given by "first start",
and the target of each succeeding first is indicated by
using the "then" keyword.

end note 
note as E4
Enable torque generation.
end note 
note as E5
Disable torque generation.
end note 
@enduml

