<text text-anchor="start" x="1271" y="-328" font-family="Helvetica,sans-Serif" font-size="10.00">The classification of materials into metals and</text>
<text text-anchor="start" x="1271" y="-317" font-family="Helvetica,sans-Serif" font-size="10.00">alloys is grossly simplified and not exhaustive.</text>
<text text-anchor="start" x="1271" y="-306" font-family="Helvetica,sans-Serif" font-size="10.00">A more complete classification would include:</text>
<text text-anchor="start" x="1271" y="-295" font-family="Helvetica,sans-Serif" font-size="10.00">ChemicalSubstance, PureMaterial, MixedMaterial,</text>
<text text-anchor="start" x="1271" y="-284" font-family="Helvetica,sans-Serif" font-size="10.00">Class, Ceramic, OrganicMaterial,</text>
<text text-anchor="start" x="1271" y="-273" font-family="Helvetica,sans-Serif" font-size="10.00">AnorganicMaterial, Polymer, HybridMaterial,</text>
<text text-anchor="start" x="1271" y="-262" font-family="Helvetica,sans-Serif" font-size="10.00">CompositeMaterial,</text>
<text text-anchor="start" x="1271" y="-251" font-family="Helvetica,sans-Serif" font-size="10.00">etc.</text>
</g>
