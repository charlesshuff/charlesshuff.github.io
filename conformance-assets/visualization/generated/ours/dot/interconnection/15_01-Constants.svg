<text text-anchor="start" x="2823.5" y="-251.5" font-family="Helvetica,sans-Serif" font-size="10.00">Standard mathematical constants</text>
<text text-anchor="start" x="2823.5" y="-228.5" font-family="Helvetica,sans-Serif" font-size="10.00">Irrational constants cannot be represented</text>
<text text-anchor="start" x="2823.5" y="-217.5" font-family="Helvetica,sans-Serif" font-size="10.00">exactly with finite precision.</text>
<text text-anchor="start" x="2823.5" y="-206.5" font-family="Helvetica,sans-Serif" font-size="10.00">However, they can be required to be implemented</text>
<text text-anchor="start" x="2823.5" y="-195.5" font-family="Helvetica,sans-Serif" font-size="10.00">with a attribute that is accurate</text>
<text text-anchor="start" x="2823.5" y="-184.5" font-family="Helvetica,sans-Serif" font-size="10.00">to at least a certain precision.</text>
<text text-anchor="start" x="2823.5" y="-161.5" font-family="Helvetica,sans-Serif" font-size="10.00">(The decimal literals here should be interpreted</text>
<text text-anchor="start" x="2823.5" y="-150.5" font-family="Helvetica,sans-Serif" font-size="10.00">as being fixed point and exact.)</text>
</g>
