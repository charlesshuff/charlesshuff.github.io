<text text-anchor="start" x="1943" y="-268" font-family="Helvetica,sans-Serif" font-size="10.00">Standard fundamental physical constants</text>
<text text-anchor="start" x="1943" y="-245" font-family="Helvetica,sans-Serif" font-size="10.00">Physical constants have a standard measured</text>
<text text-anchor="start" x="1943" y="-234" font-family="Helvetica,sans-Serif" font-size="10.00">attribute to a finite precision.</text>
<text text-anchor="start" x="1943" y="-211" font-family="Helvetica,sans-Serif" font-size="10.00">The reference source is:</text>
<text text-anchor="start" x="1943" y="-200" font-family="Helvetica,sans-Serif" font-size="10.00">CODATA &#45; Task Group on Fundamental Physical</text>
<text text-anchor="start" x="1943" y="-189" font-family="Helvetica,sans-Serif" font-size="10.00">Constants (TGFC) &#45; 2018 CODATA recommended</text>
<text text-anchor="start" x="1943" y="-178" font-family="Helvetica,sans-Serif" font-size="10.00">values</text>
<text text-anchor="start" x="1943" y="-167" font-family="Helvetica,sans-Serif" font-size="10.00">See</text>
<text text-anchor="start" x="1943" y="-156" font-family="Helvetica,sans-Serif" font-size="10.00">https://codata.org/initiatives/strategic&#45;programme/fundamental&#45;physical&#45;constants/</text>
<text text-anchor="start" x="1943" y="-145" font-family="Helvetica,sans-Serif" font-size="10.00">For the actual values see</text>
<text text-anchor="start" x="1943" y="-134" font-family="Helvetica,sans-Serif" font-size="10.00">https://pml.nist.gov/cuu/Constants/</text>
</g>
