<text text-anchor="start" x="1032" y="-129" font-family="Helvetica,sans-Serif" font-size="10.00">&#39;frontWheel&#39; is a nested part of type &#39;Wheel&#39;</text>
<text text-anchor="start" x="1032" y="-118" font-family="Helvetica,sans-Serif" font-size="10.00">with</text>
<text text-anchor="start" x="1032" y="-107" font-family="Helvetica,sans-Serif" font-size="10.00">multiplicity &quot;2&quot;. This means that this axle</text>
<text text-anchor="start" x="1032" y="-96" font-family="Helvetica,sans-Serif" font-size="10.00">assembly</text>
<text text-anchor="start" x="1032" y="-85" font-family="Helvetica,sans-Serif" font-size="10.00">must have exactly two wheels. However, there is</text>
<text text-anchor="start" x="1032" y="-74" font-family="Helvetica,sans-Serif" font-size="10.00">still</text>
<text text-anchor="start" x="1032" y="-63" font-family="Helvetica,sans-Serif" font-size="10.00">only one &#39;frontWheel&#39; part. The part is</text>
<text text-anchor="start" x="1032" y="-52" font-family="Helvetica,sans-Serif" font-size="10.00">&quot;ordered&quot;,</text>
<text text-anchor="start" x="1032" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00">so that the first wheel can be distinguished</text>
<text text-anchor="start" x="1032" y="-30" font-family="Helvetica,sans-Serif" font-size="10.00">from the</text>
<text text-anchor="start" x="1032" y="-19" font-family="Helvetica,sans-Serif" font-size="10.00">second.</text>
</g>
