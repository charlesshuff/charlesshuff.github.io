<text text-anchor="start" x="257.5" y="-136.5" font-family="Helvetica,sans-Serif" font-size="10.00">Standard mathematical constants</text>
<text text-anchor="start" x="257.5" y="-113.5" font-family="Helvetica,sans-Serif" font-size="10.00">Irrational constants cannot be represented</text>
<text text-anchor="start" x="257.5" y="-102.5" font-family="Helvetica,sans-Serif" font-size="10.00">exactly with finite precision.</text>
<text text-anchor="start" x="257.5" y="-91.5" font-family="Helvetica,sans-Serif" font-size="10.00">However, they can be required to be implemented</text>
<text text-anchor="start" x="257.5" y="-80.5" font-family="Helvetica,sans-Serif" font-size="10.00">with a attribute that is accurate</text>
<text text-anchor="start" x="257.5" y="-69.5" font-family="Helvetica,sans-Serif" font-size="10.00">to at least a certain precision.</text>
<text text-anchor="start" x="257.5" y="-46.5" font-family="Helvetica,sans-Serif" font-size="10.00">(The decimal literals here should be interpreted</text>
<text text-anchor="start" x="257.5" y="-35.5" font-family="Helvetica,sans-Serif" font-size="10.00">as being fixed point and exact.)</text>
</g>
