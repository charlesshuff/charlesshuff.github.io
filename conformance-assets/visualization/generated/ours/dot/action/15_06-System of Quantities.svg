<text text-anchor="start" x="293" y="-388.5" font-family="Helvetica,sans-Serif" font-size="10.00">Above capabilities were implemented in:</text>
<text text-anchor="start" x="293" y="-377.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library Quantities:</text>
<text text-anchor="start" x="293" y="-366.5" font-family="Helvetica,sans-Serif" font-size="10.00">TensorQuantityValue, VectorQuantityValue,</text>
<text text-anchor="start" x="293" y="-355.5" font-family="Helvetica,sans-Serif" font-size="10.00">ScalarQuantityValue,</text>
<text text-anchor="start" x="293" y="-344.5" font-family="Helvetica,sans-Serif" font-size="10.00">tensorQuantities, vectorQuantities,</text>
<text text-anchor="start" x="293" y="-333.5" font-family="Helvetica,sans-Serif" font-size="10.00">scalarQuantities,</text>
<text text-anchor="start" x="293" y="-322.5" font-family="Helvetica,sans-Serif" font-size="10.00">SystemOfQuantities</text>
<text text-anchor="start" x="293" y="-311.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library MeasurementReferences:</text>
<text text-anchor="start" x="293" y="-300.5" font-family="Helvetica,sans-Serif" font-size="10.00">TensorMeasurementReference,</text>
<text text-anchor="start" x="293" y="-289.5" font-family="Helvetica,sans-Serif" font-size="10.00">VectorMeasurementReference,</text>
<text text-anchor="start" x="293" y="-278.5" font-family="Helvetica,sans-Serif" font-size="10.00">ScalarMeasurementReference,</text>
<text text-anchor="start" x="293" y="-267.5" font-family="Helvetica,sans-Serif" font-size="10.00">SystemOfUnits</text>
<text text-anchor="start" x="293" y="-256.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library ISQBase:</text>
<text text-anchor="start" x="293" y="-245.5" font-family="Helvetica,sans-Serif" font-size="10.00">attribute &lt;isq&gt; &#39;International System of</text>
<text text-anchor="start" x="293" y="-234.5" font-family="Helvetica,sans-Serif" font-size="10.00">Quantities&#39;: SystemOfQuantities in ISQBase</text>
</g>
