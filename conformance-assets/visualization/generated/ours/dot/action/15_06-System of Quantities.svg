<title>n0</title>
<polygon fill="#fffbe6" stroke="black" points="254,-616 0,-616 0,0 260,0 260,-610 254,-616"/>
<polyline fill="none" stroke="black" points="254,-616 254,-610 "/>
<polyline fill="none" stroke="black" points="260,-610 254,-610 "/>
<text text-anchor="start" x="8" y="-604" font-family="Helvetica,sans-Serif" font-size="10.00">A System of Quantities is represented by a model</text>
<text text-anchor="start" x="8" y="-593" font-family="Helvetica,sans-Serif" font-size="10.00">library package.</text>
<text text-anchor="start" x="8" y="-570" font-family="Helvetica,sans-Serif" font-size="10.00">Its structure is modeled after the International</text>
<text text-anchor="start" x="8" y="-559" font-family="Helvetica,sans-Serif" font-size="10.00">System of Quantities (ISQ):</text>
<text text-anchor="start" x="8" y="-548" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; Quantity dimension is defined as the product</text>
<text text-anchor="start" x="8" y="-537" font-family="Helvetica,sans-Serif" font-size="10.00">of powers of a selected set of base quantities.</text>
<text text-anchor="start" x="8" y="-526" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A system of quantities is multi&#45;dimensional</text>
<text text-anchor="start" x="8" y="-515" font-family="Helvetica,sans-Serif" font-size="10.00">space spanned by the powers of its base</text>
<text text-anchor="start" x="8" y="-504" font-family="Helvetica,sans-Serif" font-size="10.00">quantities.</text>
<text text-anchor="start" x="8" y="-493" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; Any base quantity is modeled as a</text>
<text text-anchor="start" x="8" y="-482" font-family="Helvetica,sans-Serif" font-size="10.00">specialization of a SimpleUnit. Such a</text>
<text text-anchor="start" x="8" y="-471" font-family="Helvetica,sans-Serif" font-size="10.00">specialized SimpleUnit defines one base unit</text>
<text text-anchor="start" x="8" y="-460" font-family="Helvetica,sans-Serif" font-size="10.00">vector</text>
<text text-anchor="start" x="8" y="-449" font-family="Helvetica,sans-Serif" font-size="10.00">(with power one by definition), e.g. MassUnit</text>
<text text-anchor="start" x="8" y="-438" font-family="Helvetica,sans-Serif" font-size="10.00">with symbol M, that establishes a base quantity</text>
<text text-anchor="start" x="8" y="-427" font-family="Helvetica,sans-Serif" font-size="10.00">dimension for the system of quantities,</text>
<text text-anchor="start" x="8" y="-416" font-family="Helvetica,sans-Serif" font-size="10.00">without committing yet to a particular choice of</text>
<text text-anchor="start" x="8" y="-405" font-family="Helvetica,sans-Serif" font-size="10.00">measurement unit.</text>
<text text-anchor="start" x="8" y="-394" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; To complete the system of quantities any</text>
<text text-anchor="start" x="8" y="-383" font-family="Helvetica,sans-Serif" font-size="10.00">number of derived quantities can be added.</text>
<text text-anchor="start" x="8" y="-372" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A derived quantity is modeled as a</text>
<text text-anchor="start" x="8" y="-361" font-family="Helvetica,sans-Serif" font-size="10.00">specialization of a DerivedUnit. A DerivedUnit</text>
<text text-anchor="start" x="8" y="-350" font-family="Helvetica,sans-Serif" font-size="10.00">is defined in terms of so&#45;called</text>
<text text-anchor="start" x="8" y="-339" font-family="Helvetica,sans-Serif" font-size="10.00">UnitPowerFactors.</text>
<text text-anchor="start" x="8" y="-328" font-family="Helvetica,sans-Serif" font-size="10.00">Each UnitPowerFactor is a combination of a base</text>
<text text-anchor="start" x="8" y="-317" font-family="Helvetica,sans-Serif" font-size="10.00">(or other derived) quantity and an exponent.</text>
<text text-anchor="start" x="8" y="-306" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; As an example the AccelerationUnit</text>
<text text-anchor="start" x="8" y="-295" font-family="Helvetica,sans-Serif" font-size="10.00">(specialization of DerivedUnit) can be defined</text>
<text text-anchor="start" x="8" y="-284" font-family="Helvetica,sans-Serif" font-size="10.00">as the combination of LengthUnit (symbol L)</text>
<text text-anchor="start" x="8" y="-273" font-family="Helvetica,sans-Serif" font-size="10.00">to the power 1 and TimeUnit (symbol T) to the</text>
<text text-anchor="start" x="8" y="-262" font-family="Helvetica,sans-Serif" font-size="10.00">power &#45;2, so having quantity dimension L¹⋅T⁻².</text>
<text text-anchor="start" x="8" y="-251" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A quantity of dimension one is defined as a</text>
<text text-anchor="start" x="8" y="-240" font-family="Helvetica,sans-Serif" font-size="10.00">derived quantity for which the effective</text>
<text text-anchor="start" x="8" y="-229" font-family="Helvetica,sans-Serif" font-size="10.00">exponent for each</text>
<text text-anchor="start" x="8" y="-218" font-family="Helvetica,sans-Serif" font-size="10.00">of its base quantity power factors is zero.</text>
<text text-anchor="start" x="8" y="-207" font-family="Helvetica,sans-Serif" font-size="10.00">Historically a quantity of dimension one was</text>
<text text-anchor="start" x="8" y="-196" font-family="Helvetica,sans-Serif" font-size="10.00">also called a dimensionless quantity.</text>
<text text-anchor="start" x="8" y="-185" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A quantity of dimension one may be defined by</text>
<text text-anchor="start" x="8" y="-174" font-family="Helvetica,sans-Serif" font-size="10.00">adding all quantity power factors that cancel</text>
<text text-anchor="start" x="8" y="-163" font-family="Helvetica,sans-Serif" font-size="10.00">out by having positive and negative</text>
<text text-anchor="start" x="8" y="-152" font-family="Helvetica,sans-Serif" font-size="10.00">exponents. Doing so enables distinction between</text>
<text text-anchor="start" x="8" y="-141" font-family="Helvetica,sans-Serif" font-size="10.00">different &#39;kinds of&#39; quantities of dimension</text>
<text text-anchor="start" x="8" y="-130" font-family="Helvetica,sans-Serif" font-size="10.00">one, e.g:</text>
<text text-anchor="start" x="8" y="-119" font-family="Helvetica,sans-Serif" font-size="10.00">angle (L¹⋅L⁻¹), mass ratio (L¹⋅L⁻¹), power ratio</text>
<text text-anchor="start" x="8" y="-108" font-family="Helvetica,sans-Serif" font-size="10.00">(L²⋅M⋅T⁻³⋅L⁻²⋅M⁻¹⋅T³), Mach number</text>
<text text-anchor="start" x="8" y="-97" font-family="Helvetica,sans-Serif" font-size="10.00">(L¹⋅T⁻¹⋅L⁻¹⋅T¹).</text>
<text text-anchor="start" x="8" y="-74" font-family="Helvetica,sans-Serif" font-size="10.00">The International System of Quantities (ISQ) as</text>
<text text-anchor="start" x="8" y="-63" font-family="Helvetica,sans-Serif" font-size="10.00">defined in ISO/IEC 80000 is added as a</text>
<text text-anchor="start" x="8" y="-52" font-family="Helvetica,sans-Serif" font-size="10.00">predefined model library to SysML v2.</text>
<text text-anchor="start" x="8" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00">However, this does not prevent to model any</text>
<text text-anchor="start" x="8" y="-30" font-family="Helvetica,sans-Serif" font-size="10.00">other system of quantities in another model</text>
<text text-anchor="start" x="8" y="-19" font-family="Helvetica,sans-Serif" font-size="10.00">library and use it.</text>
</g>
