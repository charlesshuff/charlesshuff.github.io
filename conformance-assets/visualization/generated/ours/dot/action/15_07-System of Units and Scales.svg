<text text-anchor="start" x="8" y="-802" font-family="Helvetica,sans-Serif" font-size="10.00">A System of Units and Scales is represented by a</text>
<text text-anchor="start" x="8" y="-791" font-family="Helvetica,sans-Serif" font-size="10.00">model library package.</text>
<text text-anchor="start" x="8" y="-768" font-family="Helvetica,sans-Serif" font-size="10.00">Its structure is modeled after the International</text>
<text text-anchor="start" x="8" y="-757" font-family="Helvetica,sans-Serif" font-size="10.00">System of Units &#45;&#45; Système Internationale</text>
<text text-anchor="start" x="8" y="-746" font-family="Helvetica,sans-Serif" font-size="10.00">d&#39;Unités, abbreviated to SI &#45;&#45; as defined in</text>
<text text-anchor="start" x="8" y="-735" font-family="Helvetica,sans-Serif" font-size="10.00">ISO/IEC 80000:</text>
<text text-anchor="start" x="8" y="-724" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; Measurement units and scales are generalized</text>
<text text-anchor="start" x="8" y="-713" font-family="Helvetica,sans-Serif" font-size="10.00">to a common super type MeasurementReference.</text>
<text text-anchor="start" x="8" y="-702" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A particular quantity is modeled as the tuple</text>
<text text-anchor="start" x="8" y="-691" font-family="Helvetica,sans-Serif" font-size="10.00">of a numerical value (i.e. a mathematical</text>
<text text-anchor="start" x="8" y="-680" font-family="Helvetica,sans-Serif" font-size="10.00">number) and a MeasurementReference.</text>
<text text-anchor="start" x="8" y="-669" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; An actual measurement unit is modeled as a</text>
<text text-anchor="start" x="8" y="-658" font-family="Helvetica,sans-Serif" font-size="10.00">usage of a specialization of either SimpleUnit</text>
<text text-anchor="start" x="8" y="-647" font-family="Helvetica,sans-Serif" font-size="10.00">or DerivedUnit, e.g. TimeUnit or ForceUnit,</text>
<text text-anchor="start" x="8" y="-636" font-family="Helvetica,sans-Serif" font-size="10.00">see the SI package.</text>
<text text-anchor="start" x="8" y="-625" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; The quantity dimension of the actual unit</text>
<text text-anchor="start" x="8" y="-614" font-family="Helvetica,sans-Serif" font-size="10.00">usage must match the quantity dimension of the</text>
<text text-anchor="start" x="8" y="-603" font-family="Helvetica,sans-Serif" font-size="10.00">generic quantity unit definition that it is a</text>
<text text-anchor="start" x="8" y="-592" font-family="Helvetica,sans-Serif" font-size="10.00">usage of.</text>
<text text-anchor="start" x="8" y="-581" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A system of units and scales must define</text>
<text text-anchor="start" x="8" y="-570" font-family="Helvetica,sans-Serif" font-size="10.00">exactly one selected base unit for each base</text>
<text text-anchor="start" x="8" y="-559" font-family="Helvetica,sans-Serif" font-size="10.00">quantity in the associated system of quantities.</text>
<text text-anchor="start" x="8" y="-548" font-family="Helvetica,sans-Serif" font-size="10.00">The collection of</text>
<text text-anchor="start" x="8" y="-537" font-family="Helvetica,sans-Serif" font-size="10.00">base units forms the foundation for automated</text>
<text text-anchor="start" x="8" y="-526" font-family="Helvetica,sans-Serif" font-size="10.00">quantity value conversion between any pair of</text>
<text text-anchor="start" x="8" y="-515" font-family="Helvetica,sans-Serif" font-size="10.00">compatible units and/or scales.</text>
<text text-anchor="start" x="8" y="-504" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; If only a measurement unit is used on a</text>
<text text-anchor="start" x="8" y="-493" font-family="Helvetica,sans-Serif" font-size="10.00">quantity value, it implies expression on a ratio</text>
<text text-anchor="start" x="8" y="-482" font-family="Helvetica,sans-Serif" font-size="10.00">scale, in other words only the ratio between the</text>
<text text-anchor="start" x="8" y="-471" font-family="Helvetica,sans-Serif" font-size="10.00">actual quantity value,</text>
<text text-anchor="start" x="8" y="-460" font-family="Helvetica,sans-Serif" font-size="10.00">and the defined unit value is of importance. On</text>
<text text-anchor="start" x="8" y="-449" font-family="Helvetica,sans-Serif" font-size="10.00">ratio scales for one kind of quantity that only</text>
<text text-anchor="start" x="8" y="-438" font-family="Helvetica,sans-Serif" font-size="10.00">differ in their unit (e.g. metre and inch)</text>
<text text-anchor="start" x="8" y="-427" font-family="Helvetica,sans-Serif" font-size="10.00">zero is zero no matter what unit is selected.</text>
<text text-anchor="start" x="8" y="-416" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; A unit may carry a conversion factor</text>
<text text-anchor="start" x="8" y="-405" font-family="Helvetica,sans-Serif" font-size="10.00">definition w.r.t. to another reference unit. It</text>
<text text-anchor="start" x="8" y="-394" font-family="Helvetica,sans-Serif" font-size="10.00">can be a conversion by convention (e.g. between</text>
<text text-anchor="start" x="8" y="-383" font-family="Helvetica,sans-Serif" font-size="10.00">metre and foot) or</text>
<text text-anchor="start" x="8" y="-372" font-family="Helvetica,sans-Serif" font-size="10.00">via an ISO/IEC 80000 prefix symbol that</text>
<text text-anchor="start" x="8" y="-361" font-family="Helvetica,sans-Serif" font-size="10.00">indicates a decimal or binary multiple or</text>
<text text-anchor="start" x="8" y="-350" font-family="Helvetica,sans-Serif" font-size="10.00">sub&#45;multiple (e.g. kilo, nano, mega, kibi, mebi,</text>
<text text-anchor="start" x="8" y="-339" font-family="Helvetica,sans-Serif" font-size="10.00">...). See package SIPrefixes.</text>
<text text-anchor="start" x="8" y="-328" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; In addition to measurement units / ratio</text>
<text text-anchor="start" x="8" y="-317" font-family="Helvetica,sans-Serif" font-size="10.00">scales also other types of measurement scales</text>
<text text-anchor="start" x="8" y="-306" font-family="Helvetica,sans-Serif" font-size="10.00">are supported. The additional scales are:</text>
<text text-anchor="start" x="8" y="-295" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; ordinal scales (e.g. Beaufort wind force,</text>
<text text-anchor="start" x="8" y="-284" font-family="Helvetica,sans-Serif" font-size="10.00">Richter Scale, Rockwell C hardness scale),</text>
<text text-anchor="start" x="8" y="-273" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; interval scales (e.g. absolute temperature in</text>
<text text-anchor="start" x="8" y="-262" font-family="Helvetica,sans-Serif" font-size="10.00">deg C or F),</text>
<text text-anchor="start" x="8" y="-251" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; cyclic ratio scales (e.g. rotation angle with</text>
<text text-anchor="start" x="8" y="-240" font-family="Helvetica,sans-Serif" font-size="10.00">modulus 360 degree),</text>
<text text-anchor="start" x="8" y="-229" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; logarithmic scales (e.g. dB(A) or dBA sound</text>
<text text-anchor="start" x="8" y="-218" font-family="Helvetica,sans-Serif" font-size="10.00">pressure level w.r.t. a reference ambient</text>
<text text-anchor="start" x="8" y="-207" font-family="Helvetica,sans-Serif" font-size="10.00">pressure, dB(m) or dBm power ratio w.r.t. 1 mW).</text>
<text text-anchor="start" x="8" y="-196" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; Any base unit quantity is modeled as a</text>
<text text-anchor="start" x="8" y="-185" font-family="Helvetica,sans-Serif" font-size="10.00">specialization of a SimpleUnit. This specialized</text>
<text text-anchor="start" x="8" y="-174" font-family="Helvetica,sans-Serif" font-size="10.00">SimpleUnit (e.g. MassUnit) defines one base unit</text>
<text text-anchor="start" x="8" y="-163" font-family="Helvetica,sans-Serif" font-size="10.00">vector (with power one by definition)</text>
<text text-anchor="start" x="8" y="-152" font-family="Helvetica,sans-Serif" font-size="10.00">that establishes a base quantity dimension for</text>
<text text-anchor="start" x="8" y="-141" font-family="Helvetica,sans-Serif" font-size="10.00">the system of quantities, without committing yet</text>
<text text-anchor="start" x="8" y="-130" font-family="Helvetica,sans-Serif" font-size="10.00">to a particular choice of measurement unit.</text>
<text text-anchor="start" x="8" y="-107" font-family="Helvetica,sans-Serif" font-size="10.00">The International System of Units (SI) as</text>
<text text-anchor="start" x="8" y="-96" font-family="Helvetica,sans-Serif" font-size="10.00">defined in ISO/IEC 80000 as well as the US</text>
<text text-anchor="start" x="8" y="-85" font-family="Helvetica,sans-Serif" font-size="10.00">Customary System of Units as defined by NIST SP</text>
<text text-anchor="start" x="8" y="-74" font-family="Helvetica,sans-Serif" font-size="10.00">811</text>
<text text-anchor="start" x="8" y="-63" font-family="Helvetica,sans-Serif" font-size="10.00">are added as predefined model libraries to SysML</text>
<text text-anchor="start" x="8" y="-52" font-family="Helvetica,sans-Serif" font-size="10.00">v2.</text>
<text text-anchor="start" x="8" y="-41" font-family="Helvetica,sans-Serif" font-size="10.00">However, this does not prevent to model any</text>
<text text-anchor="start" x="8" y="-30" font-family="Helvetica,sans-Serif" font-size="10.00">other system of units and scales in another</text>
<text text-anchor="start" x="8" y="-19" font-family="Helvetica,sans-Serif" font-size="10.00">model library and use it.</text>
</g>
