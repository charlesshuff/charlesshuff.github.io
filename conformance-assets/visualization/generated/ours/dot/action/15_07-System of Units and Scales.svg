<text text-anchor="start" x="293.5" y="-482" font-family="Helvetica,sans-Serif" font-size="10.00">Above capabilities were implemented in:</text>
<text text-anchor="start" x="293.5" y="-471" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library MeasurementReferences:</text>
<text text-anchor="start" x="293.5" y="-460" font-family="Helvetica,sans-Serif" font-size="10.00">TensorMeasurementReference,</text>
<text text-anchor="start" x="293.5" y="-449" font-family="Helvetica,sans-Serif" font-size="10.00">VectorMeasurementReference,</text>
<text text-anchor="start" x="293.5" y="-438" font-family="Helvetica,sans-Serif" font-size="10.00">ScalarMeasurementReference,</text>
<text text-anchor="start" x="293.5" y="-427" font-family="Helvetica,sans-Serif" font-size="10.00">MeasurementUnit, OrdinalScale, IntervalScale,</text>
<text text-anchor="start" x="293.5" y="-416" font-family="Helvetica,sans-Serif" font-size="10.00">CyclicRatioScale, LogarithmicScale,</text>
<text text-anchor="start" x="293.5" y="-405" font-family="Helvetica,sans-Serif" font-size="10.00">SystemOfUnits</text>
<text text-anchor="start" x="293.5" y="-394" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library SI:</text>
<text text-anchor="start" x="293.5" y="-383" font-family="Helvetica,sans-Serif" font-size="10.00">attribute &lt;si&gt; &#39;ISO/IEC 80000 International</text>
<text text-anchor="start" x="293.5" y="-372" font-family="Helvetica,sans-Serif" font-size="10.00">System of Units&#39; : SystemOfUnits</text>
<text text-anchor="start" x="293.5" y="-361" font-family="Helvetica,sans-Serif" font-size="10.00">:&gt;&gt; systemOfQuantities = isq;</text>
<text text-anchor="start" x="293.5" y="-350" font-family="Helvetica,sans-Serif" font-size="10.00">:&gt;&gt; baseUnits = (m, kg, s, A, K, mol, cd);</text>
<text text-anchor="start" x="293.5" y="-339" font-family="Helvetica,sans-Serif" font-size="10.00">}</text>
</g>
