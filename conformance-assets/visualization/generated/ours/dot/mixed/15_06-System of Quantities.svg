<text text-anchor="start" x="24" y="-476.5" font-family="Helvetica,sans-Serif" font-size="10.00">Above capabilities were implemented in:</text>
<text text-anchor="start" x="24" y="-465.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library Quantities:</text>
<text text-anchor="start" x="24" y="-454.5" font-family="Helvetica,sans-Serif" font-size="10.00">TensorQuantityValue, VectorQuantityValue,</text>
<text text-anchor="start" x="24" y="-443.5" font-family="Helvetica,sans-Serif" font-size="10.00">ScalarQuantityValue,</text>
<text text-anchor="start" x="24" y="-432.5" font-family="Helvetica,sans-Serif" font-size="10.00">tensorQuantities, vectorQuantities,</text>
<text text-anchor="start" x="24" y="-421.5" font-family="Helvetica,sans-Serif" font-size="10.00">scalarQuantities,</text>
<text text-anchor="start" x="24" y="-410.5" font-family="Helvetica,sans-Serif" font-size="10.00">SystemOfQuantities</text>
<text text-anchor="start" x="24" y="-399.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library MeasurementReferences:</text>
<text text-anchor="start" x="24" y="-388.5" font-family="Helvetica,sans-Serif" font-size="10.00">TensorMeasurementReference,</text>
<text text-anchor="start" x="24" y="-377.5" font-family="Helvetica,sans-Serif" font-size="10.00">VectorMeasurementReference,</text>
<text text-anchor="start" x="24" y="-366.5" font-family="Helvetica,sans-Serif" font-size="10.00">ScalarMeasurementReference,</text>
<text text-anchor="start" x="24" y="-355.5" font-family="Helvetica,sans-Serif" font-size="10.00">SystemOfUnits</text>
<text text-anchor="start" x="24" y="-344.5" font-family="Helvetica,sans-Serif" font-size="10.00">&#45; standard library ISQBase:</text>
<text text-anchor="start" x="24" y="-333.5" font-family="Helvetica,sans-Serif" font-size="10.00">attribute &lt;isq&gt; &#39;International System of</text>
<text text-anchor="start" x="24" y="-322.5" font-family="Helvetica,sans-Serif" font-size="10.00">Quantities&#39;: SystemOfQuantities in ISQBase</text>
</g>
